#cloud-config
packages:
  - ca-certificates
  - curl

groups:
  - docker

ssh_pwauth: false

users:
  - name: engineer
    groups:
      - sudo
      - docker
    sudo:
      - ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true

  - name: ci
    groups:
      - docker
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${ci_ssh_public_key}

write_files:
  - path: /etc/ssh/cloudflare-access-ca.pub
    owner: root:root
    permissions: '0644'
    content: |
      ${cloudflare_access_ssh_ca_public_key}

  - path: /etc/ssh/sshd_config.d/disable-root.conf
    owner: root:root
    permissions: '0644'
    content: |
      PermitRootLogin no

  - path: /etc/ssh/sshd_config.d/cloudflare-access.conf
    owner: root:root
    permissions: '0644'
    content: |
      TrustedUserCAKeys /etc/ssh/cloudflare-access-ca.pub

  - path: /home/ci/docker-cleanup.sh
    owner: ci:ci
    permissions: '0700'
    content: |
      #!/bin/bash
      docker system prune -af

%{ if use_as_nat ~}
  - path: /etc/networkd-dispatcher/routable.d/10-eth0-post-up
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash

      echo 1 > /proc/sys/net/ipv4/ip_forward
%{ if floating_ip != "" ~}
      iptables -t nat -A POSTROUTING -o eth0 -j SNAT --to ${floating_ip}
%{ else ~}
      iptables -t nat -A POSTROUTING -s '${vpc_cidr}' -o eth0 -j MASQUERADE
%{ endif ~}

      # Docker sets the FORWARD chain default policy to DROP and only allows
      # forwarding for its own bridge networks, which would otherwise block
      # traffic being routed through this NAT gateway before it reaches the
      # rule above. DOCKER-USER is evaluated first and Docker never rewrites
      # it, so rules added here survive Docker restarts and reboots.
      iptables -I DOCKER-USER -s '${vpc_cidr}' -j ACCEPT
      iptables -I DOCKER-USER -d '${vpc_cidr}' -j ACCEPT
%{ endif ~}

%{ if floating_ip != "" ~}
  - path: /etc/netplan/60-floating-ip.yaml
    owner: root:root
    permissions: '0600'
    content: |
      network:
        version: 2
        renderer: networkd
        ethernets:
          eth0:
            addresses:
              - ${floating_ip}/32
%{ endif ~}

runcmd:
  - ufw disable
  - |
    # Install Docker using official Docker repository
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc

    # Add the repository to Apt sources (supports both ARM and AMD64)
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

    # Update and install Docker
    apt-get update
    apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

    # Verify installation
    docker --version
    docker compose version
  - echo "0 23 * * * /home/ci/docker-cleanup.sh" | crontab -u ci -
  - passwd -l root
  - chage -E -1 -M -1 -I -1 -m 0 root
  - systemctl restart ssh
%{ if floating_ip != "" ~}
  - netplan apply
%{ endif ~}
%{ if use_as_nat ~}
  - reboot
%{ endif ~}
