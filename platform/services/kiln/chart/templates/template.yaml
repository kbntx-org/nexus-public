apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiln
  labels:
    app: kiln
spec:
  replicas: {{ .Values.replicas | default 2 }}
  {{- with .Values.deploymentStrategy }}
  strategy:
    type: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app: kiln
  template:
    metadata:
      labels:
        app: kiln
    spec:
      containers:
        - name: kiln
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          {{- if .Values.devMode }}
          env:
            - name: DEV_CLIENT_URL
              value: http://localhost:{{ .Values.frontend.containerPort | default 5173 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.containerPort | default 8080 }}
          {{- if .Values.healthProbes }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.containerPort | default 8080 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.containerPort | default 8080 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          {{- with .Values.resources }}
          {{- if or .requests .limits }}
          resources:
            {{- with .requests }}
            requests:
              {{- if .memory }}
              memory: {{ .memory }}
              {{- end }}
              {{- if .cpu }}
              cpu: {{ .cpu }}
              {{- end }}
            {{- end }}
            {{- with .limits }}
            limits:
              {{- if .memory }}
              memory: {{ .memory }}
              {{- end }}
              {{- if .cpu }}
              cpu: {{ .cpu }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- end }}
        {{- if .Values.devMode }}
        - name: kiln-client
          image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.frontend.containerPort | default 5173 }}
        {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kiln-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kiln
---
apiVersion: v1
kind: Service
metadata:
  name: kiln-service
  labels:
    app: kiln
spec:
  selector:
    app: kiln
  ports:
    - port: {{ .Values.containerPort | default 8080 }}
      targetPort: {{ .Values.containerPort | default 8080 }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kiln-ingress
  labels:
    external-dns/enabled: 'true'
  annotations:
    external-dns.kubernetes.io/target: {{ .Values.internalIngressTarget }}
spec:
  routes:
    {{- $ingressHosts := .Values.ingressHosts }}
    {{- range $host := $ingressHosts }}
    {{- if $host }}
    - match: Host(`{{ $host }}`)
      kind: Rule
      services:
        - name: kiln-service
          port: {{ $.Values.containerPort | default 8080 }}
    {{- end }}
    {{- end }}
  tls:
    secretName: kiln-tls
{{- if .Values.certificate.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kiln-tls
spec:
  secretName: kiln-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    {{- range $host := $ingressHosts }}
    {{- if $host }}
    - {{ $host }}
    {{- end }}
    {{- end }}
{{- end }}
