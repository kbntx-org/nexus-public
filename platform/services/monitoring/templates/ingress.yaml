apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: monitoring-ingress
  labels:
    external-dns/enabled: 'true'
  annotations:
    external-dns.kubernetes.io/target: {{ .Values.ingress.internalIngressTarget }}
spec:
  routes:
    - match: Host(`{{ .Values.ingress.grafanaHost }}`)
      kind: Rule
      services:
        - name: monitoring-grafana
          port: 80
    - match: Host(`{{ .Values.ingress.prometheusHost }}`)
      kind: Rule
      services:
        - name: prometheus-operated
          port: 9090
  tls:
    secretName: monitoring-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-tls
spec:
  secretName: monitoring-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.ingress.grafanaHost }}
    - {{ .Values.ingress.prometheusHost }}
