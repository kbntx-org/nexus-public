apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-cleaner
  labels:
    app: registry-cleaner
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: registry-cleaner
          annotations:
            checksum/config: {{ toYaml .Values.config | sha256sum }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: registry-cleaner
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              imagePullPolicy: Always
              env:
                - name: REGISTRY_CLEANER_CONFIG
                  value: /etc/registry-cleaner/config.yaml
                - name: DOCKER_HUB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: registry-cleaner-secret
                      key: dockerHubUsername
                - name: DOCKER_HUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: registry-cleaner-secret
                      key: dockerHubToken
              volumeMounts:
                - name: config
                  mountPath: /etc/registry-cleaner
                  readOnly: true
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: config
              configMap:
                name: registry-cleaner-config
