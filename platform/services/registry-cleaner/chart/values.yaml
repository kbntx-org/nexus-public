image:
  repository: kbntx/registry-cleaner
  tag: latest

schedule: '0 3 * * *'

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

config:
  logLevel: info
  dockerHub:
    namespace: kbntx
  policies:
    - repositories:
        - '*'
      rules:
        - priority: 1
          description: Keep latest
          action: keep
          tagPattern: '^latest$'
        - priority: 2
          description: Keep the 10 newest
          action: keep
          newest: 10
        - priority: 3
          description: Delete anything older than 5 days
          action: delete
          olderThan: 5d
