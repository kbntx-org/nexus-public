apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: atlantis-ingress
  labels:
    external-dns/enabled: 'true'
  annotations:
    external-dns.kubernetes.io/target: {{ .Values.internalIngressTarget }}
spec:
  routes:
    - match: Host(`{{ .Values.ingressHost }}`)
      kind: Rule
      services:
        - name: atlantis
          port: 80
  {{- if .Values.certificate.enabled }}
  tls:
    secretName: atlantis-tls
  {{- else }}
  tls: {}
  {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: atlantis-webhook-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.webhookHost }}`) && PathPrefix(`/events`)
      kind: Rule
      services:
        - name: atlantis
          port: 80
  {{- if .Values.certificate.enabled }}
  tls:
    secretName: atlantis-tls
  {{- else }}
  tls: {}
  {{- end }}
