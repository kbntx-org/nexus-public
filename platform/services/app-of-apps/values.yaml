applicationSourcePolicy:
  project: product
  repository: https://github.com/kbntx-org/nexus
  pathPrefix: apps/

argocd-apps:
  projects:
    platform:
      namespace: argocd
      additionalAnnotations:
        argocd.argoproj.io/sync-wave: '-1'
      description: Cluster-level building blocks and services hosted on the platform
      sourceRepos:
        - https://github.com/kbntx-org/nexus.git
        - https://github.com/kbntx-org/nexus-manifests.git
      destinations:
        - server: https://kubernetes.default.svc
          namespace: '*'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'

    product:
      namespace: argocd
      additionalAnnotations:
        argocd.argoproj.io/sync-wave: '-1'
      description: Product applications from apps/
      sourceRepos:
        - https://github.com/kbntx-org/nexus.git
        - https://github.com/kbntx-org/nexus-manifests.git
      destinations:
        - server: https://kubernetes.default.svc
          namespace: smelt
      # Argo CD also hides the kinds a project doesn't permit from its resource tree, so the Pods
      # behind a Deployment, Job or CNPG Cluster need the whole core group to show up.
      namespaceResourceWhitelist:
        - group: ''
          kind: '*'
        - group: apps
          kind: '*'
        - group: batch
          kind: '*'
        - group: autoscaling
          kind: '*'
        - group: policy
          kind: '*'
        - group: cert-manager.io
          kind: '*'
        - group: external-secrets.io
          kind: '*'
        - group: postgresql.cnpg.io
          kind: '*'
        - group: traefik.io
          kind: '*'
      namespaceResourceBlacklist:
        - group: ''
          kind: ResourceQuota
        - group: ''
          kind: LimitRange

  applicationsets:
    applications:
      namespace: argocd
      goTemplate: true
      goTemplateOptions:
        - missingkey=error
      generators:
        - matrix:
            generators:
              - git:
                  repoURL: https://github.com/kbntx-org/nexus.git
                  revision: main
                  files:
                    - path: '**/argo.yaml'
              - list:
                  elementsYaml: '{{ .environments | toJson }}'
      # Lets auto-sync be turned off from the ArgoCD UI, during an incident or a database restore,
      # without the ApplicationSet turning it back on.
      ignoreApplicationDifferences:
        - jsonPointers:
            - /spec/syncPolicy/automated
      syncPolicy:
        # Deleting the ApplicationSet itself leaves every app running instead of deleting them all.
        preserveResourcesOnDeletion: true
      # prod keeps the bare names the Applications had before the ApplicationSet adopted them.
      template:
        metadata:
          name: '{{ .app }}{{ if ne .env "prod" }}-{{ .env }}{{ end }}'
        spec:
          project: '{{ .project }}'
          destination:
            server: https://kubernetes.default.svc
            namespace: '{{ dig "namespace" .app . }}{{ if ne .env "prod" }}-{{ .env }}{{ end }}'
      # The template only reads the argo.yaml keys listed in argo.schema.json.
      templatePatch: |
        {{- $valueFiles := dig "valueFiles" (list) . }}
        {{- if dig "deleteResources" true . }}
        metadata:
          finalizers:
            - resources-finalizer.argocd.argoproj.io
        {{- end }}
        spec:
          {{- with dig "manifestsValues" "" . }}
          sources:
            - repoURL: https://github.com/kbntx-org/nexus.git
              path: {{ $.path.path | quote }}
              targetRevision: main
              helm:
                valueFiles: {{ append (default (list "values.yaml") $valueFiles) (printf "$values/%s" .) | toJson }}
            - repoURL: https://github.com/kbntx-org/nexus-manifests.git
              targetRevision: main
              ref: values
          {{- else }}
          source:
            repoURL: https://github.com/kbntx-org/nexus.git
            path: {{ .path.path | quote }}
            targetRevision: main
            {{- with $valueFiles }}
            helm:
              valueFiles: {{ toJson . }}
            {{- end }}
          {{- end }}
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true
              {{- if dig "serverSideApply" false . }}
              - ServerSideApply=true
              {{- end }}
