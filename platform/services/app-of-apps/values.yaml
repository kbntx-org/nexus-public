productSourcePolicy:
  project: product
  repository: https://github.com/kbntx-org/nexus.git
  pathPrefix: apps/

argocd-apps:
  projects:
    platform:
      namespace: argocd
      additionalAnnotations:
        argocd.argoproj.io/sync-wave: '-1'
      description: Cluster-level building blocks and services hosted on the platform
      sourceRepos:
        - https://github.com/kbntx-org/nexus.git
        - https://github.com/kbntx-org/nexus-manifests.git
      destinations:
        - server: https://kubernetes.default.svc
          namespace: '*'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'

    product:
      namespace: argocd
      additionalAnnotations:
        argocd.argoproj.io/sync-wave: '-1'
      description: Product applications from apps/
      sourceRepos:
        - https://github.com/kbntx-org/nexus.git
        - https://github.com/kbntx-org/nexus-manifests.git
      destinations:
        - server: https://kubernetes.default.svc
          namespace: portfolio
        - server: https://kubernetes.default.svc
          namespace: smelt
      namespaceResourceWhitelist:
        - group: ''
          kind: ConfigMap
        - group: ''
          kind: Secret
        - group: ''
          kind: Service
        - group: ''
          kind: ServiceAccount
        - group: ''
          kind: PersistentVolumeClaim
        - group: apps
          kind: '*'
        - group: batch
          kind: '*'
        - group: autoscaling
          kind: '*'
        - group: policy
          kind: '*'
        - group: cert-manager.io
          kind: '*'
        - group: external-secrets.io
          kind: '*'
        - group: postgresql.cnpg.io
          kind: '*'
        - group: traefik.io
          kind: '*'

  applications:
    traefik-ingress:
      project: platform
      source:
        repoURL: https://github.com/kbntx-org/nexus.git
        path: platform/core/traefik
        targetRevision: main
        helm:
          valueFiles:
            - values.yaml
            - values.prod.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: traefik-ingress
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

    argocd:
      project: platform
      source:
        repoURL: https://github.com/kbntx-org/nexus.git
        path: platform/core/argocd
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

    external-secrets:
      project: platform
      source:
        repoURL: https://github.com/kbntx-org/nexus.git
        path: platform/core/external-secrets/deploy
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

    vault:
      project: platform
      source:
        repoURL: https://github.com/kbntx-org/nexus.git
        path: platform/core/vault/server
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: vault
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

    cloudnative-pg:
      project: platform
