{{- if .Values.oauth2Proxy.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-secret-sa
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: headlamp-secret-store
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: headlamp-secret-sa
            audiences:
              - vault
      path: platform
      server: https://vault.kbntx.com
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oauth2-proxy
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: headlamp-secret-store
    kind: SecretStore
  target:
    name: headlamp-oauth2-proxy
  dataFrom:
    - extract:
        key: headlamp
{{- end }}
