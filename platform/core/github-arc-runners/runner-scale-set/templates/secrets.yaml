apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-arc-runners-{{ .Values.poolName }}-sa
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: github-arc-runners-{{ .Values.poolName }}-secret-store
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: github-arc-runners-{{ .Values.poolName }}-sa
            audiences:
              - vault
      path: platform
      server: https://vault.kbntx.com
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-arc-runners-{{ .Values.poolName }}-secret
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: github-arc-runners-{{ .Values.poolName }}-secret-store
    kind: SecretStore
  target:
    name: github-arc-runners-{{ .Values.poolName }}-secret
  data:
    - secretKey: github_app_id
      remoteRef:
        key: {{ .Values.vaultKey }}
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: {{ .Values.vaultKey }}
        property: github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: {{ .Values.vaultKey }}
        property: github_app_private_key
{{- if .Values.karpenter.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-arc-runners-{{ .Values.poolName }}-userdata
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: github-arc-runners-{{ .Values.poolName }}-secret-store
    kind: SecretStore
  target:
    name: github-arc-runners-{{ .Values.poolName }}-userdata
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        userData: |
          #cloud-config
          ssh_pwauth: false

          write_files:
            - path: /etc/rancher/k3s/config.yaml.template
              owner: root:root
              permissions: '0600'
              content: |
                token: {{ `{{ .agentToken }}` }}
                server: "https://{{ .Values.karpenter.userData.k3sServerURL }}:6443"
                flannel-iface: enp7s0
                node-ip: ${NODE_IP}
                node-name: ${NODE_NAME}
                kubelet-arg:
                  - "cloud-provider=external"
            - path: /etc/rancher/k3s/registries.yaml
              owner: root:root
              permissions: '0600'
              content: |
                configs:
                  "docker.io":
                    auth:
                      username: {{ `{{ .dockerUser }}` }}
                      password: {{ `{{ .dockerPassword }}` }}
          runcmd:
            - ufw disable
            - passwd -l root
            - chage -E -1 -M -1 -I -1 -m 0 root
            # These are ephemeral CI compute nodes with no need for admin
            # SSH access — unlike the rest of the fleet, they don't trust
            # the Cloudflare Access SSH CA.
            - systemctl disable --now ssh
            - export NODE_IP=$(ip -4 addr show enp7s0 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
            - export NODE_NAME=$(hostname)
            - envsubst < /etc/rancher/k3s/config.yaml.template > /etc/rancher/k3s/config.yaml
            - curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ .Values.karpenter.userData.k3sVersion }} sh -s - agent
  data:
    - secretKey: agentToken
      remoteRef:
        key: {{ .Values.vaultKey }}
        property: agentToken
    - secretKey: dockerUser
      remoteRef:
        key: {{ .Values.vaultKey }}
        property: dockerUser
    - secretKey: dockerPassword
      remoteRef:
        key: {{ .Values.vaultKey }}
        property: dockerPassword
{{- end }}
