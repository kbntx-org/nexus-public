---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: tunnels.cloudflare.kbntx.com
spec:
  group: cloudflare.kbntx.com
  names:
    kind: Tunnel
    listKind: TunnelList
    plural: tunnels
    singular: tunnel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.tunnelID
      name: Tunnel ID
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Tunnel is a namespaced Cloudflare Tunnel, backed by a cloudflared Deployment this
          controller creates and keeps in sync.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TunnelSpec defines the desired state of a Cloudflare Tunnel and the cloudflared
              deployment that runs it.
            properties:
              image:
                default: cloudflare/cloudflared:2026.7.3
                description: Image is the cloudflared image run by the tunnel pods.
                type: string
              ingress:
                description: |-
                  Ingress lists public hostname routing rules for this tunnel, evaluated in order. If the
                  last rule has a Hostname, the controller appends a catch-all rule after it, since
                  Cloudflare requires the ingress list to end with one.
                items:
                  description: |-
                    IngressRule maps a public hostname to the local service cloudflared proxies matching
                    requests to.
                  properties:
                    hostname:
                      description: |-
                        Hostname is the public hostname to match, e.g. "app.kbntx.com" or "*.kbntx.com". Omit
                        only on a trailing catch-all rule.
                      type: string
                    originRequest:
                      description: OriginRequest customizes how cloudflared connects
                        to Service.
                      properties:
                        matchSNItoHost:
                          description: |-
                            MatchSNIToHost makes cloudflared send the same hostname as the request's Host header for
                            the TLS SNI when connecting to Service, instead of Service's own hostname.
                          type: boolean
                      type: object
                    service:
                      description: |-
                        Service is the address cloudflared proxies matching requests to, e.g.
                        "https://traefik-ingress.traefik-ingress.svc.cluster.local", or "http_status:404" for a
                        catch-all rule that returns 404.
                      type: string
                  required:
                  - service
                  type: object
                type: array
              name:
                description: Name is the tunnel name shown in the Cloudflare dashboard.
                  Defaults to the resource name.
                type: string
              podDisruptionBudget:
                description: |-
                  PodDisruptionBudget, if set, creates a PodDisruptionBudget for the tunnel's cloudflared
                  pods.
                properties:
                  minAvailable:
                    default: 1
                    description: |-
                      MinAvailable is the minimum number of cloudflared pods that must remain available during
                      a voluntary disruption.
                    format: int32
                    type: integer
                type: object
              replicas:
                default: 2
                description: Replicas is the number of cloudflared pod replicas.
                format: int32
                type: integer
              routes:
                description: Routes lists private network CIDRs, e.g. "10.42.0.0/16",
                  to route through this tunnel.
                items:
                  type: string
                type: array
            type: object
          status:
            description: TunnelStatus reflects the observed state of a Cloudflare
              Tunnel.
            properties:
              message:
                description: Message describes the last reconciliation result, useful
                  when Ready is false.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled
                  by the controller.
                format: int64
                type: integer
              ready:
                description: Ready is true once the tunnel, its routes, and its cloudflared
                  deployment are reconciled.
                type: boolean
              tunnelID:
                description: TunnelID is the Cloudflare-assigned ID of the tunnel.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
