apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-controller
  labels:
    app: cloudflare-controller
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: cloudflare-controller
  template:
    metadata:
      labels:
        app: cloudflare-controller
    spec:
      serviceAccountName: cloudflare-controller
      containers:
        - name: cloudflare-controller
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-controller-secret
                  key: apiToken
            - name: CLOUDFLARE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-controller-secret
                  key: accountId
            - name: EXTERNAL_DNS_ENABLED
              value: {{ .Values.externalDNS.enabled | quote }}
            - name: EXTERNAL_DNS_LABEL_FILTER
              value: {{ .Values.externalDNS.labelFilter | quote }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
