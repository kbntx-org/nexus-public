ingressHost: registry.kbntx.com
internalIngressTarget: 10.43.216.131

certificate:
  enabled: true

zot:
  replicaCount: 1
  strategy:
    type: Recreate

  service:
    type: ClusterIP

  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: zot-secret
          key: s3AccessKeyId
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: zot-secret
          key: s3SecretAccessKey

  externalSecrets:
    - secretName: zot-htpasswd
      mountPath: /secret

  mountConfig: true
  configFiles:
    config.json: |-
      {
        "storage": {
          "rootDirectory": "/var/lib/registry",
          "gc": true,
          "gcDelay": "15m",
          "gcInterval": "1h",
          "retention": {
            "policies": [
              {
                "repositories": [
                  "cloudflare-controller",
                  "documentation",
                  "kiln",
                  "smelt",
                  "sysbox-deploy-k8s",
                  "workspace"
                ],
                "keepTags": [{ "mostRecentlyPushedCount": 3 }]
              }
            ]
          },
          "dedupe": false,
          "storageDriver": {
            "name": "s3",
            "rootdirectory": "/registry",
            "region": "eeur",
            "bucket": "nexus-registry",
            "regionendpoint": "https://2bde0126da63a3a9c94029d14ea380db.eu.r2.cloudflarestorage.com",
            "forcepathstyle": true,
            "secure": true
          }
        },
        "http": {
          "address": "0.0.0.0",
          "port": "5000",
          "compat": ["docker2s2"],
          "auth": { "htpasswd": { "path": "/secret/htpasswd" } },
          "accessControl": {
            "repositories": {
              "**": {
                "defaultPolicy": [],
                "policies": [
                  { "users": ["ci", "node"], "actions": ["read"] },
                  { "users": ["ci"], "actions": ["create", "update", "delete"] }
                ]
              }
            }
          }
        },
        "log": { "level": "info" },
        "extensions": {
          "search": { "enable": true },
          "ui": { "enable": true },
          "sync": {
            "enable": true,
            "downloadDir": "/tmp/zot-sync",
            "registries": [
              {
                "urls": ["https://index.docker.io"],
                "onDemand": true,
                "manifestCheckInterval": "1h",
                "tlsVerify": true,
                "content": [{ "prefix": "**", "destination": "/dockerhub" }]
              },
              {
                "urls": ["https://ghcr.io"],
                "onDemand": true,
                "manifestCheckInterval": "1h",
                "tlsVerify": true,
                "content": [{ "prefix": "**", "destination": "/ghcr" }]
              }
            ]
          }
        }
      }
