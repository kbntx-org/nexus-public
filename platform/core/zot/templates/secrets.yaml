apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-secret-sa
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: zot-secret-store
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: zot-secret-sa
            audiences:
              - vault
      path: platform
      server: https://vault.kbntx.com
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secret
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: zot-secret-store
    kind: SecretStore
  target:
    name: zot-secret
  dataFrom:
    - extract:
        key: zot
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-htpasswd
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: zot-secret-store
    kind: SecretStore
  target:
    name: zot-htpasswd
    template:
      data:
        htpasswd: |
          ci:{{ `{{ .ciPasswordHash }}` }}
          node:{{ `{{ .nodePasswordHash }}` }}
  data:
    - secretKey: ciPasswordHash
      remoteRef:
        key: zot
        property: ciPasswordHash
    - secretKey: nodePasswordHash
      remoteRef:
        key: zot
        property: nodePasswordHash
