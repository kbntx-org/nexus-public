apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zot-ingress
  labels:
    external-dns/enabled: 'true'
  annotations:
    external-dns.kubernetes.io/target: {{ .Values.internalIngressTarget }}
spec:
  routes:
    - match: Host(`{{ .Values.ingressHost }}`)
      kind: Rule
      services:
        - name: zot
          port: zot
  tls:
    secretName: zot-tls
{{- if .Values.certificate.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zot-tls
spec:
  secretName: zot-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.ingressHost }}
{{- end }}
