# containerd 2.x injects these sysctls into every pod sandbox by default, and Sysbox's
# user-namespaced /proc/sys rejects the write, so sysbox-runc sandboxes fail to start.
# Drop once https://github.com/nestybox/sysbox/issues/1025 is fixed upstream.
[plugins."io.containerd.cri.v1.runtime"]
  enable_unprivileged_ports = false
  enable_unprivileged_icmp = false

[plugins."io.containerd.cri.v1.runtime".containerd.runtimes.sysbox-runc]
  runtime_type = "io.containerd.runc.v2"
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.sysbox-runc.options]
    BinaryName = "/usr/bin/sysbox-runc"
    SystemdCgroup = true
