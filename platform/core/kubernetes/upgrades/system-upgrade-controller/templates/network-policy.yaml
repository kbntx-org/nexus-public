{{- if .Values.networkPolicy.enabled }}
# The upgrade jobs run on the host network, which this policy does not select.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: system-upgrade-controller
  namespace: system-upgrade
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The API server listens on the host network, which only a port-only rule matches on every CNI.
    - ports:
        - port: 6443
          protocol: TCP
{{- end }}
