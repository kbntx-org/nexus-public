{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The webhook, called by the API server from the host network.
    - ports:
        - port: 10250
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The API server listens on the host network, which only a port-only rule matches on every CNI.
    - ports:
        - port: 6443
          protocol: TCP
    # vault.kbntx.com resolves to Traefik's internal entrypoint.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8011
          protocol: TCP
{{- end }}
