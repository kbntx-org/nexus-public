global:
  domain: argocd.kbntx.com

certificate:
  enabled: true

internalIngressTarget: 10.43.216.131
argo-cd:
  controller:
    metrics:
      enabled: true
      applicationLabels:
        enabled: true
        labels:
          - nexus/auto-sync
      serviceMonitor:
        enabled: true
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: argocd_app_info|argocd_app_labels|argocd_app_sync_total|argocd_app_reconcile_(bucket|count|sum)
            action: keep
    resources:
      requests:
        cpu: 150m
        memory: 350Mi
  dex:
    resources:
      requests:
        cpu: 1m
        memory: 120Mi
  redis:
    resources:
      requests:
        cpu: 10m
        memory: 15Mi
  server:
    resources:
      requests:
        cpu: 15m
        memory: 60Mi
  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: argocd_git_request_total|argocd_git_request_duration_seconds_(bucket|count|sum)|argocd_git_(fetch|lsremote)_fail_total|argocd_repo_pending_request_total
            action: keep
    # Git operations time out on large monorepos since v3.5.3 (https://github.com/argoproj/argo-cd/issues/29856);
    # keep the repo server on v3.5.2 until a fixed release ships.
    image:
      tag: v3.5.2
    resources:
      requests:
        cpu: 50m
        memory: 500Mi
  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: argocd_appset_owned_applications|argocd_appset_reconcile_(bucket|count|sum)
            action: keep
    resources:
      requests:
        cpu: 2m
        memory: 25Mi
  notifications:
    resources:
      requests:
        cpu: 1m
        memory: 35Mi
  configs:
    cm:
      admin.enabled: false
      accounts.ci: apiKey
      exec.enabled: true
      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: $github-oauth-secret:clientId
              clientSecret: $github-oauth-secret:clientSecret
              orgs:
                - name: kbntx-org
      # Mock ingress healthcheck until https://github.com/traefik/traefik/pull/12134 is merged.
      resource.customizations: |
        networking.k8s.io/Ingress:
          health.lua: |
            return {
              status = "Healthy",
              message = "Mock ingress to be healthy until traefik fix reporting for clusterIPs services."
            }
    rbac:
      policy.default: ''
      policy.csv: |
        g, kbntx-org:platform, role:admin

        g, ci, role:ci
        p, role:ci, applications, get, default/*, allow
        p, role:ci, applications, sync, default/*, allow
        p, role:ci, applications, update, default/*, allow
        p, role:ci, applications, action/apps/Deployment/restart, default/*, allow
    params:
      server.insecure: true
      server.dex.server: http://argocd-dex-server:5556
      server.dex.server.plaintext: true
      server.dex.server.strict.tls: false
      dexserver.disable.tls: 'true'
      reposerver.repo.cache.expiration: '1h'
