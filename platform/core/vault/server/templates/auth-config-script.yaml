{{- if not .Values.dev }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-auth-config-script
data:
  configure-auth.sh: |
    #!/bin/sh
    set -e

    kubernetesAuthMount="kubernetes"
    esoAuthRole="eso"
    esoPolicyName="eso-templated"

    vault_write_if_missing() {
      RESOURCE_PATH=$1
      shift
      if vault read "$RESOURCE_PATH" > /dev/null 2>&1; then
        echo "Resource '${RESOURCE_PATH}' already exists, skipping."
      else
        vault write "$RESOURCE_PATH" "$@"
      fi
    }

    echo "Waiting for Vault to be unsealed..."
    until vault status > /dev/null 2>&1; do
      echo "Vault not ready yet, retrying in 5s..."
      sleep 5
    done
    echo "Vault is unsealed, proceeding with auth configuration."

    echo "Enabling Kubernetes auth..."
    if vault auth list | grep -q "^${kubernetesAuthMount}/"; then
      echo "Auth method '${kubernetesAuthMount}' already enabled, skipping."
    else
      vault auth enable "$kubernetesAuthMount"
      echo "Auth method '${kubernetesAuthMount}' enabled."
    fi

    echo "Configuring Kubernetes auth..."
    vault_write_if_missing "auth/${kubernetesAuthMount}/config" \
      kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
    echo "Kubernetes auth configured with host https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}."

    echo "Creating templated ESO policy..."
    if vault policy read "$esoPolicyName" > /dev/null 2>&1; then
      echo "Policy '${esoPolicyName}' already exists, skipping."
    else
      kubernetesAuthAccessor=$(vault auth list | awk -v mount="${kubernetesAuthMount}/" '$1==mount{print $3}')
      echo "Resolved Kubernetes auth accessor: ${kubernetesAuthAccessor}"
      vault policy write "$esoPolicyName" - <<EOF
    path "platform/data/{{ "{{" }}identity.entity.aliases.${kubernetesAuthAccessor}.metadata.service_account_namespace{{ "}}" }}" {
      capabilities = ["read"]
    }

    path "platform/metadata/{{ "{{" }}identity.entity.aliases.${kubernetesAuthAccessor}.metadata.service_account_namespace{{ "}}" }}" {
      capabilities = ["read", "list"]
    }
    EOF
      echo "Policy '${esoPolicyName}' created."
    fi

    echo "Creating ESO Kubernetes role..."
    vault_write_if_missing "auth/${kubernetesAuthMount}/role/${esoAuthRole}" \
      bound_service_account_names="*" \
      bound_service_account_namespaces="*" \
      policies="$esoPolicyName" \
      audience="vault" \
      ttl=1h
    echo "Role '${esoAuthRole}' ready."

    echo "Vault auth configuration complete."
    exec sleep infinity
{{- end }}
