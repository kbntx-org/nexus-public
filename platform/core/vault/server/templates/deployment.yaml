apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app: vault
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault-sa
      {{- if .Values.dev }}
      initContainers:
        {{- include "vault.seedContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: vault
          image: {{ .Values.image }}
          args: {{ .Values.args | toJson }}
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          ports:
            - name: http
              containerPort: 8200
              protocol: TCP
          {{- if not .Values.dev }}
          env:
            - name: VAULT_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: vault-secret
                  key: databaseUri
          {{- end }}
          volumeMounts:
            - name: vault-config-map
              mountPath: /vault/config/config.hcl
              subPath: config.hcl
      volumes:
        - name: vault-config-map
          configMap:
            name: vault-config
            defaultMode: 0755
        {{- if .Values.dev }}
        - name: vault-seed-script
          configMap:
            name: vault-seed-script
            defaultMode: 0755
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app: vault
spec:
  type: ClusterIP
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: http
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault
  labels:
    app: vault
    external-dns/enabled: 'true'
  annotations:
    external-dns.kubernetes.io/target: {{ .Values.internalIngressTarget }}
spec:
  routes:
    - match: Host(`{{ .Values.ingressHost }}`)
      kind: Rule
      services:
        - name: vault
          port: 8200
  tls:
    secretName: vault-tls
{{- if .Values.certificate.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  labels:
    app: vault
spec:
  secretName: vault-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.ingressHost }}
{{- end }}
