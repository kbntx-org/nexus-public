apiVersion: v1
kind: Service
metadata:
  name: traefik-ingress-internal
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: internal-web
      port: 80
      targetPort: {{ .Values.internalWebPort }}
    - name: internal-secure
      port: 443
      targetPort: {{ .Values.internalSecurePort }}
