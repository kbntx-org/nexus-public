apiVersion: v1
kind: Service
metadata:
  name: traefik-api-service
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - port: 8080
      name: traefik
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-ingress
  labels:
    external-dns/enabled: 'true'
  annotations:
    external-dns.kubernetes.io/target: {{ .Values.internalIngressTarget }}
spec:
  routes:
    - match: Host(`{{ .Values.dashboardHost }}`)
      kind: Rule
      services:
        - name: traefik-api-service
          port: traefik
  tls:
    secretName: traefik-dashboard-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
spec:
  secretName: traefik-dashboard-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.dashboardHost }}
