apiVersion: v1
kind: Service
metadata:
  name: traefik-api-service
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - port: 8080
      name: traefik
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-ingress
spec:
  routes:
    - match: Host(`{{ .Values.dashboardHost }}`)
      kind: Rule
      services:
        - name: traefik-api-service
          port: traefik
