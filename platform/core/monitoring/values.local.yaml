devMode: true

backup:
  enabled: false

certificate:
  enabled: false

postgresCluster:
  storageClass: standard

externalSecrets:
  vaultServer: http://vault.default.svc.cluster.local:8200
  vaultPath: dev
  vaultRole: admin

ingress:
  grafanaHost: grafana.localhost
  prometheusHost: prometheus.localhost

grafana:
  grafana.ini:
    server:
      domain: grafana.localhost
      root_url: 'http://%(domain)s/'
    auth:
      disable_login: false
      disable_login_form: false

loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  global:
    extraEnv: []
    extraArgs: []
  lokiCanary:
    enabled: false
  test:
    enabled: false
  loki:
    commonConfig:
      replication_factor: 1
    limits_config:
      retention_period: 24h
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    compactor:
      delete_request_store: filesystem

mimir-distributed:
  mimir:
    structuredConfig:
      common:
        storage:
          s3:
            endpoint: rustfs.default.svc.cluster.local:9000
            region: us-east-1
            bucket_name: mimir
            insecure: true
      limits:
        compactor_blocks_retention_period: 24h
  ingester:
    persistentVolume:
      storageClass: standard

k8s-monitoring:
  cluster:
    name: local
