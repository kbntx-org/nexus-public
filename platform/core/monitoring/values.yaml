certificate:
  enabled: true

postgresCluster:
  storageClass: hcloud-volumes

backup:
  enabled: true
  destinationPath: s3://nexus-database-backups/grafana-cnpg
  endpointURL: https://2bde0126da63a3a9c94029d14ea380db.eu.r2.cloudflarestorage.com

externalSecrets:
  vaultServer: https://vault.kbntx.com
  vaultPath: platform
  vaultRole: eso

ingress:
  grafanaHost: grafana.kbntx.com
  prometheusHost: prometheus.kbntx.com
  internalIngressTarget: 10.43.216.131

grafana:
  admin:
    existingSecret: monitoring-secret
    userKey: grafanaUser
    passwordKey: grafanaPassword
  envValueFrom:
    POSTGRES_USER:
      secretKeyRef:
        name: monitoring-secret
        key: postgresUser
    POSTGRES_PASSWORD:
      secretKeyRef:
        name: monitoring-secret
        key: postgresPassword
  grafana.ini:
    server:
      domain: grafana.kbntx.com
      root_url: 'https://%(domain)s/'
    auth:
      disable_login: true
      disable_login_form: true
    database:
      type: postgres
      host: grafana-postgres-cnpg-rw:5432
      name: grafana
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      ssl_mode: disable

  persistence:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      deleteDatasources:
        - name: victoria-metrics
          orgId: 1
      datasources:
        - name: mimir
          uid: mimir
          type: prometheus
          url: http://monitoring-mimir-query-frontend:8080/prometheus
          isDefault: true
          jsonData:
            timeInterval: 60s
        - name: loki
          uid: ceyzgf1ei5dz4e
          type: loki
          url: http://monitoring-loki-gateway
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      provider:
        allowUiUpdates: false

loki:
  global:
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: S3_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: monitoring-secret
            key: lokiAccessKeyId
      - name: S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: monitoring-secret
            key: lokiSecretAccessKey
      - name: S3_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: monitoring-secret
            key: lokiEndpoint
      - name: CHUNKS_BUCKET_NAME
        valueFrom:
          secretKeyRef:
            name: monitoring-secret
            key: lokiBucketName
  chunksCache:
    enabled: false
  loki:
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 360h
    compactor:
      retention_enabled: true
      retention_delete_delay: 1h
      delete_request_store: s3
    ingester:
      chunk_encoding: snappy
    auth_enabled: false
    tracing:
      enabled: true
    querier:
      max_concurrent: 4
    storage:
      type: s3
      bucketNames:
        chunks: ${CHUNKS_BUCKET_NAME}
      s3:
        endpoint: ${S3_ENDPOINT}
        region: eeur
        secretAccessKey: ${S3_SECRET_ACCESS_KEY}
        accessKeyId: ${S3_ACCESS_KEY_ID}
        s3ForcePathStyle: false
        insecure: false

  deploymentMode: SimpleScalable
  backend:
    replicas: 3
  read:
    replicas: 3
  write:
    replicas: 3
  minio:
    enabled: false
  ruler:
    enabled: false

mimir-distributed:
  global:
    extraEnv:
      - name: S3_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: monitoring-secret
            key: mimirAccessKeyId
      - name: S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: monitoring-secret
            key: mimirSecretAccessKey
  mimir:
    structuredConfig:
      multitenancy_enabled: false
      ingest_storage:
        enabled: false
      ingester:
        push_grpc_method_enabled: true
        ring:
          replication_factor: 1
      store_gateway:
        sharding_ring:
          replication_factor: 1
      common:
        storage:
          backend: s3
          s3:
            endpoint: 2bde0126da63a3a9c94029d14ea380db.eu.r2.cloudflarestorage.com
            region: auto
            bucket_name: nexus-mimir
            access_key_id: ${S3_ACCESS_KEY_ID}
            secret_access_key: ${S3_SECRET_ACCESS_KEY}
      limits:
        compactor_blocks_retention_period: 360h
  ingester:
    replicas: 1
    zoneAwareReplication:
      enabled: false
    persistentVolume:
      storageClass: hcloud-volumes
      size: 10Gi
  store_gateway:
    zoneAwareReplication:
      enabled: false
    persistentVolume:
      enabled: false
  compactor:
    persistentVolume:
      enabled: false
  querier:
    replicas: 1
  query_scheduler:
    replicas: 1
  alertmanager:
    enabled: false
  ruler:
    enabled: false
  overrides_exporter:
    enabled: false
  rollout_operator:
    enabled: false
  minio:
    enabled: false
  kafka:
    enabled: false
  gateway:
    enabled: false

k8s-monitoring:
  cluster:
    name: nexus
  destinations:
    mimir:
      type: prometheus
      url: http://monitoring-mimir-distributor:8080/api/v1/push
    loki:
      type: loki
      url: http://monitoring-loki-gateway/loki/api/v1/push
  clusterMetrics:
    enabled: true
    collector: alloy-cluster
    apiServer:
      enabled: true
      metricsTuning:
        includeMetrics:
          - apiserver_request_total
          - apiserver_request_duration_seconds_sum
          - apiserver_request_duration_seconds_count
          - apiserver_current_inflight_requests
          - process_cpu_seconds_total
          - process_resident_memory_bytes
  hostMetrics:
    enabled: true
    collector: alloy-node
    linuxHosts:
      enabled: true
      source: alloy
      metricsTuning:
        useIntegrationAllowList: true
  podLogsViaLoki:
    enabled: true
    collector: alloy-node
  telemetryServices:
    kube-state-metrics:
      deploy: true
  collectors:
    alloy-node:
      presets: [linux-host-monitor, filesystem-log-reader, daemonset]
      controller:
        tolerations:
          - operator: Exists
    alloy-cluster:
      presets: [statefulset]
