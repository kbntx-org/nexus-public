name: Build

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to build (and push on non-PR runs)'
        required: true
        type: string
    outputs:
      deploy_targets:
        description: 'JSON array of projects whose code OR deployPaths changed since their last deploy'
        value: ${{ jobs.build.outputs.deploy_targets }}

concurrency:
  group: build-${{ inputs.image_tag }}

jobs:
  build:
    name: Build
    runs-on: nexus-org-runners
    timeout-minutes: 10
    outputs:
      deploy_targets: ${{ steps.affected.outputs.deploy_targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Compute affected
        id: affected
        uses: ./.github/actions/compute-affected
        with:
          manifests-app-id: ${{ secrets.NEXUS_MANIFESTS_APP_ID }}
          manifests-app-private-key: ${{ secrets.NEXUS_MANIFESTS_APP_PRIVATE_KEY }}

      - name: Build portfolio frontend
        if: contains(fromJSON(steps.affected.outputs.deploy_targets), 'portfolio')
        run: pnpm nx build portfolio --configuration=production
        shell: bash

      - name: Login to Docker registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - parallel:
          - name: Build (and push) portfolio image
            if: contains(fromJSON(steps.affected.outputs.deploy_targets), 'portfolio')
            uses: ./.github/actions/docker-build-and-push
            with:
              context: .
              file: apps/portfolio/Dockerfile
              tag: kbntx/portfolio:${{ inputs.image_tag }}
              push: ${{ github.event_name != 'pull_request' }}

          - name: Build (and push) documentation image
            if: contains(fromJSON(steps.affected.outputs.deploy_targets), 'documentation')
            uses: ./.github/actions/docker-build-and-push
            with:
              context: docs
              file: docs/Dockerfile
              tag: kbntx/documentation:${{ inputs.image_tag }}
              push: ${{ github.event_name != 'pull_request' }}
