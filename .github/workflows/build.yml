name: Build

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to build (and push on non-PR runs)'
        required: true
        type: string
      deploy_targets_csv:
        description: 'Comma-delimited list of nx-affected projects with a build-ci target'
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: nexus-org-runners
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Login to Docker registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push affected images
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUSH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: pnpm nx run-many --target=build-ci --projects="${{ inputs.deploy_targets_csv }}" --outputStyle=stream
        shell: bash
