name: Build

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to build (and push on non-PR runs)'
        required: true
        type: string
      deploy_targets_csv:
        description: 'Comma-delimited list of nx-affected projects with a build-ci target'
        required: true
        type: string

env:
  MIRROR_REGISTRY: registry.kbntx.com

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise-managed tools
        uses: ./.github/actions/mise-install
        with:
          tools: node pnpm

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Connect to WARP
        uses: ./.github/actions/setup-warp
        with:
          action: connect
          organization: ${{ vars.WARP_ORGANIZATION }}
          client-id: ${{ secrets.WARP_CLIENT_ID }}
          client-secret: ${{ secrets.WARP_CLIENT_SECRET }}

      - name: Set up Buildx builder
        uses: ./.github/actions/setup-buildx

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to zot
        uses: docker/login-action@v4
        with:
          registry: ${{ env.MIRROR_REGISTRY }}
          username: ${{ secrets.ZOT_CI_USER }}
          password: ${{ secrets.ZOT_CI_PASSWORD }}

      - name: Build and push affected images
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUSH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: pnpm nx run-many --target=build-ci --projects="${{ inputs.deploy_targets_csv }}" --outputStyle=stream
        shell: bash

      - name: Disconnect from WARP
        if: always()
        uses: ./.github/actions/setup-warp
        with:
          action: disconnect
