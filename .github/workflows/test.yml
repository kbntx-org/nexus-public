name: Test

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: nexus-org-runners
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
        shell: bash

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Test (affected)
        if: github.event_name == 'pull_request'
        run: pnpm nx affected --target=test --parallel --base remotes/origin/${{ github.base_ref }}
        shell: bash

      - name: Test (all)
        if: github.event_name != 'pull_request'
        run: pnpm nx run-many --target=test --all --parallel
        shell: bash
