name: Lint & Format

on:
  workflow_call:
    inputs:
      lint_projects_csv:
        description: 'Comma-delimited list of affected projects with a lint target'
        required: true
        type: string
      affected_base:
        description: 'Git ref/SHA to diff format:check against (Affected job output)'
        required: true
        type: string

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: nexus-org-runners
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - parallel:
          - name: Check formatting
            env:
              AFFECTED_BASE: ${{ inputs.affected_base }}
            run: |
              # --libs-and-apps only checks files nx considers part of a project (per the
              # project graph); the classic mode only checks files in the git diff. Neither
              # alone covers everything, so run both.
              pnpm nx format:check --base "$AFFECTED_BASE" --libs-and-apps
              pnpm nx format:check --base "$AFFECTED_BASE"
            shell: bash

          - name: Lint
            run: pnpm nx run-many --target lint --projects="${{ inputs.lint_projects_csv }}" --parallel --outputStyle=stream
            shell: bash
