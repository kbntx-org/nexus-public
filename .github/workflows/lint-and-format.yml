name: Lint & Format

on:
  workflow_call:

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: nexus-org-runners
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
        shell: bash

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - parallel:
          - name: Check formatting (affected)
            if: github.event_name == 'pull_request'
            run: pnpm nx format:check --all
            shell: bash

          - name: Check formatting (all)
            if: github.event_name != 'pull_request'
            run: pnpm nx format:check --all
            shell: bash

          - name: Lint (affected)
            if: github.event_name == 'pull_request'
            run: pnpm nx affected:lint --parallel --base remotes/origin/${{ github.base_ref }}
            shell: bash

          - name: Lint (all)
            if: github.event_name != 'pull_request'
            run: pnpm nx run-many --target lint --all --parallel
            shell: bash
