name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-format:
    name: Lint & Format
    uses: ./.github/workflows/lint-and-format.yml
    secrets: inherit

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      image_tag: ${{ github.event_name == 'pull_request' && format('pr-{0}-commit-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('main-{0}', github.sha) }}

  deploy:
    name: Deploy
    needs: [lint-and-format, test, build]
    if: |
      always() &&
      needs.lint-and-format.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled' &&
      needs.build.outputs.deploy_targets != '[]'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      image_tag: ${{ github.event_name == 'pull_request' && format('pr-{0}-commit-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('main-{0}', github.sha) }}
      deploy_targets: ${{ needs.build.outputs.deploy_targets }}
      branch: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
