name: Build and Push Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docker-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_OUTPUTS: type=registry,oci-mediatypes=true,compression=zstd,force-compression=true
      NEXUS_CI_TOOLKIT_RUNNER_VERSION: 2.337.0
      NEXUS_CI_TOOLKIT_GO_VERSION: 1.26.1
      NEXUS_CI_TOOLKIT_KUBECTL_VERSION: 1.32.0
      NEXUS_CI_TOOLKIT_ARGOCD_VERSION: 2.14.11
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve toolchain versions
        id: toolchain-versions
        run: |
          echo "node=$(jq -r '.engines.node | ltrimstr("^")' package.json)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r '.packageManager | split("@")[1]' package.json)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: nexus-ci-toolkit - build and push
        uses: docker/build-push-action@v7
        with:
          context: platform/core/github-arc-runners/base-image
          file: platform/core/github-arc-runners/base-image/Dockerfile
          outputs: ${{ env.DOCKER_BUILD_OUTPUTS }}
          tags: |
            kbntx/nexus-ci-toolkit:1.7
          platforms: linux/amd64
          build-args: |
            RUNNER_VERSION=${{ env.NEXUS_CI_TOOLKIT_RUNNER_VERSION }}
            NODE_VERSION=${{ steps.toolchain-versions.outputs.node }}
            PNPM_VERSION=${{ steps.toolchain-versions.outputs.pnpm }}
            GO_VERSION=${{ env.NEXUS_CI_TOOLKIT_GO_VERSION }}
            KUBECTL_VERSION=${{ env.NEXUS_CI_TOOLKIT_KUBECTL_VERSION }}
            ARGOCD_VERSION=${{ env.NEXUS_CI_TOOLKIT_ARGOCD_VERSION }}

      - name: sysbox-deploy-k8s - build and push
        uses: docker/build-push-action@v7
        with:
          context: platform/core/sysbox
          file: platform/core/sysbox/Dockerfile
          outputs: ${{ env.DOCKER_BUILD_OUTPUTS }}
          tags: |
            kbntx/sysbox-deploy-k8s:v0.7.1-0
          platforms: linux/amd64

      - name: Checkout karpenter-provider-hetzner
        uses: actions/checkout@v7
        with:
          repository: kbntx-org/karpenter-provider-hetzner
          ref: v2.1.0
          path: karpenter-provider-hetzner

      - name: Read karpenter-provider-hetzner chart version
        id: karpenter-provider-hetzner-version
        run: echo "appVersion=$(yq '.appVersion' karpenter-provider-hetzner/charts/karpenter-provider-hetzner/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Check if karpenter-provider-hetzner chart version is already published
        id: karpenter-provider-hetzner-chart-check
        env:
          CHART_VERSION: ${{ steps.karpenter-provider-hetzner-version.outputs.appVersion }}
        run: |
          MATCH=""
          if curl -sf "https://kbntx-org.github.io/nexus/index.yaml" -o existing-index.yaml; then
            MATCH=$(yq '.entries.karpenter-provider-hetzner[] | select(.version == env(CHART_VERSION)) | .version' existing-index.yaml)
            rm existing-index.yaml
          fi
          if [ -n "$MATCH" ]; then
            echo "chartVersionExists=true" >> "$GITHUB_OUTPUT"
          else
            echo "chartVersionExists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: karpenter-provider-hetzner - build and push
        uses: docker/build-push-action@v7
        with:
          context: karpenter-provider-hetzner
          file: karpenter-provider-hetzner/Dockerfile
          outputs: ${{ env.DOCKER_BUILD_OUTPUTS }}
          tags: |
            kbntx/karpenter-provider-hetzner:${{ steps.karpenter-provider-hetzner-version.outputs.appVersion }}
          platforms: linux/amd64

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Package karpenter-provider-hetzner chart
        run: |
          mkdir -p dist
          helm package karpenter-provider-hetzner/charts/karpenter-provider-hetzner \
            --version "${{ steps.karpenter-provider-hetzner-version.outputs.appVersion }}" \
            --app-version "${{ steps.karpenter-provider-hetzner-version.outputs.appVersion }}" \
            --destination dist

      - name: Fetch existing chart index (if any) and merge
        run: |
          if curl -sf --output dist/index-old.yaml \
            "https://kbntx-org.github.io/nexus/index.yaml"; then
            helm repo index dist \
              --url "https://kbntx-org.github.io/nexus" \
              --merge dist/index-old.yaml
            rm dist/index-old.yaml
          else
            helm repo index dist \
              --url "https://kbntx-org.github.io/nexus"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
