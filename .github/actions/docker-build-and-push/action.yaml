name: Docker build and push
description: Build and push Docker images using the Docker CLI against the runner's dind sidecar
inputs:
  tag:
    description: 'Image tag'
    required: true
  file:
    description: 'Path to Dockerfile'
    required: true
  context:
    description: 'Build context path'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Build and push with docker buildx
      shell: bash
      run: |
        docker buildx build \
          --file "${{ inputs.file }}" \
          --tag "${{ inputs.tag }}" \
          --push \
          "${{ inputs.context }}"
