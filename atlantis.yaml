version: 3

projects:
  - name: network
    dir: platform/core/network
    autoplan:
      when_modified:
        - '**/*'

  - name: warp
    dir: platform/core/warp
    autoplan:
      when_modified:
        - '**/*'

  - name: bastion
    dir: platform/core/bastion
    autoplan:
      when_modified:
        - '**/*'
        - ../../modules/**

  - name: external-secrets
    dir: platform/core/external-secrets/provision
    autoplan:
      when_modified:
        - '**/*'

  - name: kubernetes
    dir: platform/core/kubernetes/provision
    autoplan:
      when_modified:
        - '**/*'
        - ../../../modules/**
