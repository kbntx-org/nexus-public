min_version = "2026.9.1"

[settings]
lockfile = true
locked = true
minimum_release_age = "3d"

[tools]
opentofu = "1.13.9"
kind = "0.33.0"
tilt = "0.37.9"
kubectl = "1.37.2"
mkcert = "1.4.4"
github-cli = "2.104.0"
claude-code = "2.1.326"
docker-cli = "29.10.0"
docker-compose = "5.7.1"
"github:docker/buildx" = { version = "0.39.0", bin = "docker-buildx" }
helm = "3.22.1"
python = "3.15.2"
uv = "0.13.9"
yq = "4.54.3"
s5cmd = "2.3.0"
colima = "0.10.3"
lima = "2.3.0"


[tasks."lock:update"]
run = "mise lock && mise install"

[tasks."cluster"]
description = "Manage the local kind cluster, registry, and buildx builder (create|delete|recreate)"
run = "bash platform/core/local/local.sh \"${1:?Usage: mise run cluster <create|delete|recreate>}\""

[tasks."dev"]
description = "tilt up an app alongside core infra (docs|kiln)"
run = "tilt up -- \"${1:?Usage: mise run dev <docs|kiln>}\""
