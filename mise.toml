min_version = "2026.9.1"

[settings]
lockfile = true
locked = true
minimum_release_age = "3d"

[tools]
opentofu = "1.13.9"
kind = "0.33.0"
tilt = "0.37.9"
kubectl = "1.37.2"
mkcert = "1.4.4"
github-cli = "2.104.0"
claude-code = "2.1.330"
docker-cli = "29.10.0"
docker-compose = "v5.8.0"
"github:docker/buildx" = { version = "v0.39.1", bin = "docker-buildx" }
helm = "3.22.1"
python = "3.15.2"
uv = "0.13.9"
yq = "4.54.3"
s5cmd = "2.3.0"
colima = "0.10.3"
lima = "2.3.0"


[tasks."lock:update"]
run = "mise lock && mise install"

