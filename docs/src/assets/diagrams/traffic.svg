<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="traffic-title" role="img" viewBox="0 0 760 432"><title id="traffic-title">Traffic into Nexus: public requests reach Traefik through the Cloudflare edge and the cluster tunnel; WARP devices reach pods, services and nodes through Zero Trust, the cluster tunnel and the bastion tunnel. Every tunnel is opened outbound from inside the private network, which has no inbound ports.</title><style>.traffic-box{fill:none;stroke:currentColor;stroke-width:1.5}
.traffic-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.traffic-label,.traffic-small{font-family:var(--md-text-font-family,sans-serif);text-anchor:middle}
.traffic-label{fill:currentColor;font-size:14px}
.traffic-small{fill:var(--md-default-fg-color--light,#666);font-size:12px}
.traffic-start{text-anchor:start}
.traffic-public,.traffic-private,.traffic-tunnel{fill:none;stroke-width:1.5}
.traffic-public{stroke:currentColor}
.traffic-private{stroke:var(--md-accent-fg-color,#536dfe);stroke-dasharray:5 3}
.traffic-tunnel{stroke:currentColor;stroke-width:4}
.traffic-head{fill:currentColor}
.traffic-head-private{fill:var(--md-accent-fg-color,#536dfe)}</style><defs><marker id="traffic-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="traffic-head"/></marker><marker id="traffic-arrow-private" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="traffic-head-private"/></marker><marker id="traffic-arrow-tunnel" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="6" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="traffic-head"/></marker></defs><rect width="156" height="352" x="8" y="24" class="traffic-zone" rx="6"/><text x="16" y="40" class="traffic-small traffic-start">Outside</text><rect width="212" height="352" x="180" y="24" class="traffic-zone" rx="6"/><text x="188" y="40" class="traffic-small traffic-start">Cloudflare</text><rect width="344" height="352" x="408" y="24" class="traffic-zone" rx="6"/><text x="416" y="40" class="traffic-small traffic-start">Hetzner VPC · no inbound ports</text><rect width="320" height="208" x="422" y="52" class="traffic-zone" rx="6"/><text x="430" y="68" class="traffic-small traffic-start">k3s cluster</text><rect width="132" height="52" x="20" y="80" class="traffic-box" rx="6"/><text x="86" y="102" class="traffic-label">Internet user</text><text x="86" y="120" class="traffic-small">browser</text><rect width="132" height="52" x="20" y="270" class="traffic-box" rx="6"/><text x="86" y="292" class="traffic-label">Operator device</text><text x="86" y="310" class="traffic-small">WARP client</text><rect width="140" height="52" x="196" y="80" class="traffic-box" rx="6"/><text x="266" y="102" class="traffic-label">Edge</text><text x="266" y="120" class="traffic-small">DNS · WAF · DDoS</text><rect width="140" height="52" x="196" y="270" class="traffic-box" rx="6"/><text x="266" y="292" class="traffic-label">Zero Trust</text><text x="266" y="310" class="traffic-small">Gateway · Access</text><rect width="126" height="52" x="436" y="124" class="traffic-box" rx="6"/><text x="499" y="146" class="traffic-label">cloudflared</text><text x="499" y="164" class="traffic-small">Tunnel CR pods</text><rect width="134" height="48" x="596" y="80" class="traffic-box" rx="6"/><text x="663" y="100" class="traffic-label">Traefik</text><text x="663" y="118" class="traffic-small">public ingress</text><rect width="134" height="48" x="596" y="192" class="traffic-box" rx="6"/><text x="663" y="212" class="traffic-label">Apps</text><text x="663" y="230" class="traffic-small">pods · services</text><rect width="170" height="56" x="436" y="296" class="traffic-box" rx="6"/><text x="521" y="320" class="traffic-label">Bastion VPS</text><text x="521" y="338" class="traffic-small">NAT gateway · cloudflared</text><path marker-end="url(#traffic-arrow)" d="M152 106h42" class="traffic-public"/><path marker-end="url(#traffic-arrow)" d="m562 140 32-34" class="traffic-public"/><path marker-end="url(#traffic-arrow)" d="M663 128v62" class="traffic-public"/><path marker-end="url(#traffic-arrow-private)" d="M152 296h42" class="traffic-private"/><path marker-end="url(#traffic-arrow-private)" d="M499 176v40h95" class="traffic-private"/><path marker-end="url(#traffic-arrow-private)" d="M560 296v-34" class="traffic-private"/><text x="548" y="210" class="traffic-small">CIDR route</text><text x="568" y="284" class="traffic-small traffic-start">VPC route · nodes, SSH</text><path marker-end="url(#traffic-arrow-tunnel)" d="m436 140-94-32" class="traffic-tunnel"/><path marker-end="url(#traffic-arrow-tunnel)" d="m436 162-94 122" class="traffic-tunnel"/><path marker-end="url(#traffic-arrow-tunnel)" d="m436 324-94-16" class="traffic-tunnel"/><path marker-end="url(#traffic-arrow)" d="M16 408h40" class="traffic-public"/><text x="64" y="412" class="traffic-small traffic-start">public request</text><path marker-end="url(#traffic-arrow-private)" d="M176 408h40" class="traffic-private"/><text x="224" y="412" class="traffic-small traffic-start">private (WARP)</text><path marker-end="url(#traffic-arrow-tunnel)" d="M336 408h36" class="traffic-tunnel"/><text x="384" y="412" class="traffic-small traffic-start">outbound tunnel (requests ride it back in)</text></svg>