<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="atlantis-title" role="img" viewBox="0 0 760 212"><title id="atlantis-title">A pull request comment reaches Atlantis through the GitHub App webhook, over the public tunnel on the /events path only; Atlantis reads its credentials from Vault, plans and applies against the Hetzner and Cloudflare APIs, keeps state in R2, and posts the plan back on the pull request</title><style>.atlantis-box{fill:none;stroke:currentColor;stroke-width:1.5}
.atlantis-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.atlantis-line{fill:none;stroke:currentColor;stroke-width:1.5}
.atlantis-head{fill:currentColor}
.atlantis-label{fill:currentColor;font:14px var(--md-text-font-family,sans-serif)}
.atlantis-small{fill:var(--md-default-fg-color--light,#666);font:12px var(--md-text-font-family,sans-serif)}</style><defs><marker id="atlantis-arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" class="atlantis-head"/></marker></defs><rect width="160" height="196" x="8" y="8" class="atlantis-zone" rx="6"/><rect width="376" height="196" x="184" y="8" class="atlantis-zone" rx="6"/><rect width="128" height="52" x="24" y="48" class="atlantis-box" rx="6"/><rect width="128" height="52" x="200" y="48" class="atlantis-box" rx="6"/><rect width="128" height="52" x="416" y="48" class="atlantis-box" rx="6"/><rect width="128" height="52" x="416" y="136" class="atlantis-box" rx="6"/><rect width="168" height="52" x="584" y="48" class="atlantis-box" rx="6"/><rect width="168" height="52" x="584" y="136" class="atlantis-box" rx="6"/><g marker-end="url(#atlantis-arrow)" class="atlantis-line"><path d="M152 66h48"/><path d="M328 74h88"/><path d="M480 136v-36"/><path d="M544 74h40"/><path d="m544 92 40 54"/><path d="M416 92H264v36H88v-28"/></g><text x="18" y="26" class="atlantis-small">GitHub</text><text x="194" y="26" class="atlantis-small">cluster</text><g text-anchor="middle"><text x="88" y="71" class="atlantis-label">Pull request</text><text x="88" y="88" class="atlantis-small">atlantis plan</text><text x="264" y="71" class="atlantis-label">Tunnel</text><text x="264" y="88" class="atlantis-small">/events only</text><text x="372" y="66" class="atlantis-small">webhook</text><text x="480" y="71" class="atlantis-label">Atlantis</text><text x="480" y="88" class="atlantis-small">plan, apply</text><text x="480" y="159" class="atlantis-label">Vault</text><text x="480" y="176" class="atlantis-small">credentials</text><text x="668" y="71" class="atlantis-label">Hetzner, Cloudflare</text><text x="668" y="88" class="atlantis-small">provider APIs</text><text x="668" y="159" class="atlantis-label">R2</text><text x="668" y="176" class="atlantis-small">state</text><text x="176" y="146" class="atlantis-small">plan comment</text></g></svg>