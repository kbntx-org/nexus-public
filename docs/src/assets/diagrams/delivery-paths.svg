<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="delivery-paths-title" role="img" viewBox="0 0 760 228"><title id="delivery-paths-title">Two paths in: a config-only change goes straight from the Git repo to ArgoCD; a source change first goes through GitHub Actions, which builds the image and bumps its tag in nexus-manifests; either way ArgoCD syncs the workloads in the cluster</title><style>.delivery-paths-box{fill:none;stroke:currentColor;stroke-width:1.5}
.delivery-paths-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.delivery-paths-line{fill:none;stroke:currentColor;stroke-width:1.5}
.delivery-paths-head{fill:currentColor}
.delivery-paths-label{fill:currentColor;font:14px var(--md-text-font-family,sans-serif)}
.delivery-paths-small{fill:var(--md-default-fg-color--light,#666);font:12px var(--md-text-font-family,sans-serif)}</style><defs><marker id="delivery-paths-arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" class="delivery-paths-head"/></marker></defs><rect width="412" height="212" x="8" y="8" class="delivery-paths-zone" rx="6"/><rect width="316" height="212" x="436" y="8" class="delivery-paths-zone" rx="6"/><rect width="128" height="52" x="24" y="48" class="delivery-paths-box" rx="6"/><rect width="204" height="68" x="200" y="132" class="delivery-paths-box" rx="6"/><rect width="128" height="52" x="456" y="48" class="delivery-paths-box" rx="6"/><rect width="116" height="52" x="620" y="48" class="delivery-paths-box" rx="6"/><g marker-end="url(#delivery-paths-arrow)" class="delivery-paths-line"><path d="M152 74h304"/><path d="M88 100v66h112"/><path d="M404 166h116v-66"/><path d="M584 74h36"/></g><text x="18" y="26" class="delivery-paths-small">GitHub</text><text x="446" y="26" class="delivery-paths-small">cluster</text><g text-anchor="middle"><text x="88" y="71" class="delivery-paths-label">Git repo</text><text x="88" y="88" class="delivery-paths-small">push</text><text x="302" y="158" class="delivery-paths-label">GitHub Actions</text><text x="302" y="175" class="delivery-paths-small">build image, bump tag</text><text x="302" y="191" class="delivery-paths-small">in nexus-manifests</text><text x="520" y="71" class="delivery-paths-label">ArgoCD</text><text x="520" y="88" class="delivery-paths-small">sync</text><text x="678" y="71" class="delivery-paths-label">Workloads</text><text x="678" y="88" class="delivery-paths-small">new state</text><text x="300" y="66" class="delivery-paths-small">config-only change</text><text x="300" y="92" class="delivery-paths-small">Helm values, manifests</text><text x="144" y="158" class="delivery-paths-small">source change</text></g></svg>