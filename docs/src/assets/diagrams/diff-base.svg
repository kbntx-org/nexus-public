<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="diff-base-title" role="img" viewBox="0 0 760 344"><title id="diff-base-title">Diff base resolution: on main, walk completed Checks runs newest first and take the first whose commit is an ancestor of HEAD and whose Pipeline gate succeeded, falling back to the empty tree with a warning; a pull request always diffs against origin/main</title><style>.diff-base-box{fill:none;stroke:currentColor;stroke-width:1.5}
.diff-base-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.diff-base-accent{stroke:var(--md-accent-fg-color,#536dfe)}
.diff-base-line{fill:none;stroke:currentColor;stroke-width:1.5}
.diff-base-head{fill:currentColor}
.diff-base-label{fill:currentColor;font:14px var(--md-text-font-family,sans-serif)}
.diff-base-small{fill:var(--md-default-fg-color--light,#666);font:12px var(--md-text-font-family,sans-serif)}</style><defs><marker id="diff-base-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="diff-base-head"/></marker></defs><rect width="744" height="232" x="8" y="8" class="diff-base-zone" rx="6"/><rect width="744" height="86" x="8" y="250" class="diff-base-zone" rx="6"/><rect width="150" height="52" x="20" y="124" class="diff-base-box" rx="6"/><path d="m280 110 80 40-80 40-80-40zm200 0 80 40-80 40-80-40z" class="diff-base-box"/><rect width="154" height="52" x="590" y="40" class="diff-base-box diff-base-accent" rx="6"/><rect width="154" height="52" x="590" y="124" class="diff-base-box diff-base-accent" rx="6"/><rect width="150" height="40" x="20" y="282" class="diff-base-box" rx="6"/><rect width="154" height="52" x="590" y="276" class="diff-base-box diff-base-accent" rx="6"/><g marker-end="url(#diff-base-arrow)" class="diff-base-line"><path d="M170 150h30"/><path d="M360 150h40"/><path d="M560 150h30"/><path d="M480 190v32H95v-46"/><path d="M95 124V66h495"/><path d="M170 302h420"/></g><path d="M280 190v32" class="diff-base-line"/><text x="18" y="26" class="diff-base-small">push to main</text><text x="18" y="268" class="diff-base-small">pull request</text><g text-anchor="middle"><text x="95" y="147" class="diff-base-label">Next Checks run</text><text x="95" y="164" class="diff-base-small">newest first</text><text x="280" y="147" class="diff-base-label">Ancestor</text><text x="280" y="163" class="diff-base-small">of HEAD?</text><text x="480" y="147" class="diff-base-label">Pipeline gate</text><text x="480" y="163" class="diff-base-small">succeeded?</text><text x="380" y="142" class="diff-base-small">yes</text><text x="575" y="142" class="diff-base-small">yes</text><text x="300" y="210" class="diff-base-small">no</text><text x="500" y="210" class="diff-base-small">no</text><text x="340" y="58" class="diff-base-small">no runs left</text><text x="667" y="63" class="diff-base-label">Empty tree</text><text x="667" y="80" class="diff-base-small">warning logged</text><text x="667" y="147" class="diff-base-label">That commit</text><text x="667" y="164" class="diff-base-small">becomes the base</text><text x="95" y="307" class="diff-base-label">PR run</text><text x="380" y="294" class="diff-base-small">whatever the PR&apos;s own base branch</text><text x="667" y="299" class="diff-base-label">origin/main</text><text x="667" y="316" class="diff-base-small">trunk</text></g></svg>