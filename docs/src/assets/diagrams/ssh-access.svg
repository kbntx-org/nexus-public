<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="ssh-access-title" role="img" viewBox="0 0 760 128"><title id="ssh-access-title">SSH to a node: the operator&apos;s WARP device passes the Zero Trust Access identity and device posture checks, then the session reaches the node&apos;s private IP through the bastion tunnel with a short-lived SSH certificate that the node&apos;s sshd trusts.</title><style>.ssh-access-box{fill:none;stroke:currentColor;stroke-width:1.5}
.ssh-access-label,.ssh-access-small{font-family:var(--md-text-font-family,sans-serif);text-anchor:middle}
.ssh-access-label{fill:currentColor;font-size:14px}
.ssh-access-small{fill:var(--md-default-fg-color--light,#666);font-size:12px}
.ssh-access-line{fill:none;stroke:currentColor;stroke-width:1.5}
.ssh-access-head{fill:currentColor}</style><defs><marker id="ssh-access-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="ssh-access-head"/></marker></defs><rect width="152" height="52" x="16" y="62" class="ssh-access-box" rx="6"/><text x="92" y="84" class="ssh-access-label">Operator device</text><text x="92" y="102" class="ssh-access-small">WARP client</text><rect width="152" height="52" x="208" y="62" class="ssh-access-box" rx="6"/><text x="284" y="84" class="ssh-access-label">Zero Trust Access</text><text x="284" y="102" class="ssh-access-small">email + device posture</text><rect width="152" height="52" x="400" y="62" class="ssh-access-box" rx="6"/><text x="476" y="84" class="ssh-access-label">Bastion tunnel</text><text x="476" y="102" class="ssh-access-small">VPC route</text><rect width="152" height="52" x="592" y="62" class="ssh-access-box" rx="6"/><text x="668" y="84" class="ssh-access-label">Hetzner node</text><text x="668" y="102" class="ssh-access-small">sshd trusts the CA</text><path marker-end="url(#ssh-access-arrow)" d="M168 88h38" class="ssh-access-line"/><path marker-end="url(#ssh-access-arrow)" d="M360 88h38" class="ssh-access-line"/><path marker-end="url(#ssh-access-arrow)" d="M552 88h38" class="ssh-access-line"/><text x="188" y="48" class="ssh-access-small">SSH</text><text x="380" y="48" class="ssh-access-small">short-lived SSH cert</text><text x="572" y="48" class="ssh-access-small">private IP</text></svg>