<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="local-development-title" role="img" viewBox="0 0 760 356"><title id="local-development-title">Local development: mise run dev starts Tilt on your machine, which builds images with the buildx builder, pushes them to the local registry and helm-installs them into the kind cluster, whose containerd pulls from that registry as a mirror; Tilt live-syncs file changes into the app containers; the browser reaches apps over https://*.localhost through ports 80 and 443 mapped into the kind node, where Traefik terminates TLS with an mkcert certificate reissued by watch-ingresses; core infra is always on and apps are opt-in.</title><style>.local-development-box{fill:none;stroke:currentColor;stroke-width:1.5}
.local-development-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.local-development-label,.local-development-small{font-family:var(--md-text-font-family,sans-serif);text-anchor:middle}
.local-development-label{fill:currentColor;font-size:14px}
.local-development-small{fill:var(--md-default-fg-color--light,#666);font-size:12px}
.local-development-start{text-anchor:start}
.local-development-line{fill:none;stroke:currentColor;stroke-width:1.5}
.local-development-head{fill:currentColor}</style><defs><marker id="local-development-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4Z" class="local-development-head"/></marker></defs><rect width="744" height="340" x="8" y="8" class="local-development-zone" rx="6"/><text x="16" y="24" class="local-development-small local-development-start">Your machine</text><rect width="356" height="304" x="388" y="36" class="local-development-zone" rx="6"/><text x="396" y="52" class="local-development-small local-development-start">kind cluster · kind Docker network</text><rect width="140" height="52" x="24" y="64" class="local-development-box" rx="6"/><text x="94" y="86" class="local-development-label">Browser</text><text x="94" y="104" class="local-development-small">https://*.localhost</text><rect width="140" height="52" x="24" y="160" class="local-development-box" rx="6"/><text x="94" y="182" class="local-development-label">Tilt</text><text x="94" y="200" class="local-development-small">watches files</text><rect width="140" height="52" x="24" y="260" class="local-development-box" rx="6"/><text x="94" y="282" class="local-development-label">buildx builder</text><text x="94" y="300" class="local-development-small">BuildKit container</text><rect width="120" height="52" x="220" y="260" class="local-development-box" rx="6"/><text x="280" y="282" class="local-development-label">Local registry</text><text x="280" y="300" class="local-development-small">container</text><rect width="324" height="52" x="404" y="64" class="local-development-box" rx="6"/><text x="566" y="86" class="local-development-label">Traefik</text><text x="566" y="104" class="local-development-small">ingress · mkcert TLS, reissued by watch-ingresses</text><rect width="140" height="52" x="404" y="160" class="local-development-box" rx="6"/><text x="474" y="182" class="local-development-label">Opt-in apps</text><text x="474" y="200" class="local-development-small">mise run dev &lt;app&gt;</text><rect width="168" height="68" x="560" y="160" class="local-development-box" rx="6"/><text x="644" y="182" class="local-development-label">Core infra</text><text x="644" y="200" class="local-development-small">always on</text><text x="644" y="216" class="local-development-small">Cilium · Vault · CNPG…</text><rect width="140" height="52" x="404" y="260" class="local-development-box" rx="6"/><text x="474" y="282" class="local-development-label">kind node</text><text x="474" y="300" class="local-development-small">containerd mirror</text><g marker-end="url(#local-development-arrow)" class="local-development-line"><path d="M164 90h238"/><path d="M474 116v42"/><path d="M164 178h238"/><path d="M164 196h222"/><path d="M94 212v46"/><path d="M164 286h54"/><path d="M340 286h62"/><path d="M474 260v-46"/></g><text x="283" y="82" class="local-development-small">ports 80 / 443 into the node</text><text x="283" y="170" class="local-development-small">live sync</text><text x="283" y="212" class="local-development-small">helm install</text><text x="102" y="240" class="local-development-small local-development-start">build</text><text x="191" y="278" class="local-development-small">push</text><text x="368" y="278" class="local-development-small">pull</text></svg>