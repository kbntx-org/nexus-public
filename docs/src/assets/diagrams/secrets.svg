<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="secrets-title" role="img" viewBox="0 0 760 292"><title id="secrets-title">Secrets in Nexus: Vault sits behind a Traefik IngressRoute and stores its KV data in a CloudNativePG cluster backed up to R2. The External Secrets Operator authenticates to Vault with a ServiceAccount token that Vault checks through the Kubernetes TokenReview API, reads the KV on each refresh and writes a Kubernetes Secret that the application pod mounts.</title><style>.secrets-box{fill:none;stroke:currentColor;stroke-width:1.5}
.secrets-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.secrets-label,.secrets-small{font-family:var(--md-text-font-family,sans-serif);text-anchor:middle}
.secrets-label{fill:currentColor;font-size:14px}
.secrets-small{fill:var(--md-default-fg-color--light,#666);font-size:12px}
.secrets-start{text-anchor:start}
.secrets-end{text-anchor:end}
.secrets-line{fill:none;stroke:currentColor;stroke-width:1.5}
.secrets-auth{fill:none;stroke:var(--md-accent-fg-color,#536dfe);stroke-width:1.5;stroke-dasharray:5 3}
.secrets-head{fill:currentColor}
.secrets-head-auth{fill:var(--md-accent-fg-color,#536dfe)}</style><defs><marker id="secrets-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="secrets-head"/></marker><marker id="secrets-arrow-auth" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="secrets-head-auth"/></marker></defs><rect width="548" height="106" x="6" y="22" class="secrets-zone" rx="6"/><text x="14" y="38" class="secrets-small secrets-start">vault namespace</text><rect width="358" height="92" x="388" y="190" class="secrets-zone" rx="6"/><text x="396" y="206" class="secrets-small secrets-start">application namespace</text><rect width="140" height="48" x="16" y="66" class="secrets-box" rx="6"/><text x="86" y="86" class="secrets-label">Traefik</text><text x="86" y="104" class="secrets-small">IngressRoute</text><rect width="140" height="48" x="208" y="66" class="secrets-box" rx="6"/><text x="278" y="86" class="secrets-label">Vault</text><text x="278" y="104" class="secrets-small">KV v2</text><rect width="140" height="48" x="400" y="66" class="secrets-box" rx="6"/><text x="470" y="86" class="secrets-label">CNPG cluster</text><text x="470" y="104" class="secrets-small">Postgres storage</text><rect width="140" height="48" x="592" y="66" class="secrets-box" rx="6"/><text x="662" y="86" class="secrets-label">R2 bucket</text><text x="662" y="104" class="secrets-small">barman backups</text><rect width="140" height="48" x="16" y="220" class="secrets-box" rx="6"/><text x="86" y="240" class="secrets-label">Kubernetes API</text><text x="86" y="258" class="secrets-small">TokenReview API</text><rect width="140" height="48" x="208" y="220" class="secrets-box" rx="6"/><text x="278" y="240" class="secrets-label">External Secrets</text><text x="278" y="258" class="secrets-small">Operator</text><rect width="140" height="48" x="400" y="220" class="secrets-box" rx="6"/><text x="470" y="240" class="secrets-label">Kubernetes</text><text x="470" y="258" class="secrets-small">Secret</text><rect width="140" height="48" x="592" y="220" class="secrets-box" rx="6"/><text x="662" y="240" class="secrets-label">Application</text><text x="662" y="258" class="secrets-small">pod</text><path marker-end="url(#secrets-arrow)" d="M156 90h50" class="secrets-line"/><path marker-end="url(#secrets-arrow)" d="M348 90h50" class="secrets-line"/><path marker-end="url(#secrets-arrow)" d="M540 90h50" class="secrets-line"/><text x="374" y="58" class="secrets-small">reads/writes</text><text x="560" y="58" class="secrets-small secrets-start">WAL + base</text><path marker-end="url(#secrets-arrow)" d="M302 114v104" class="secrets-line"/><text x="310" y="172" class="secrets-small secrets-start">KV read on refresh</text><path marker-end="url(#secrets-arrow-auth)" d="M258 220V116" class="secrets-auth"/><text x="250" y="172" class="secrets-small secrets-end">SA token</text><path marker-end="url(#secrets-arrow-auth)" d="m216 114-74 104" class="secrets-auth"/><text x="160" y="172" class="secrets-small secrets-end">validates token</text><path marker-end="url(#secrets-arrow)" d="M348 244h50" class="secrets-line"/><path marker-end="url(#secrets-arrow)" d="M540 244h50" class="secrets-line"/><text x="566" y="212" class="secrets-small">mounts</text></svg>