<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="pipeline-title" role="img" viewBox="0 0 760 396"><title id="pipeline-title">CI/CD pipeline: Affected fans out to Lint and format, Test and Build, which feed the Checks gate; Deploy commits to nexus-manifests, which ArgoCD syncs to the cluster; the Pipeline gate runs on trunk only</title><style>.pipeline-box{fill:none;stroke:currentColor;stroke-width:1.5}
.pipeline-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.pipeline-accent{stroke:var(--md-accent-fg-color,#536dfe)}
.pipeline-line{fill:none;stroke:currentColor;stroke-width:1.5}
.pipeline-head{fill:currentColor}
.pipeline-label{fill:currentColor;font:14px var(--md-text-font-family,sans-serif)}
.pipeline-small{fill:var(--md-default-fg-color--light,#666);font:12px var(--md-text-font-family,sans-serif)}</style><defs><marker id="pipeline-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="pipeline-head"/></marker></defs><rect width="744" height="200" x="8" y="8" class="pipeline-zone" rx="6"/><rect width="364" height="144" x="8" y="244" class="pipeline-zone" rx="6"/><rect width="364" height="144" x="388" y="244" class="pipeline-zone" rx="6"/><rect width="120" height="116" x="624" y="64" class="pipeline-zone pipeline-accent" rx="6"/><rect width="100" height="52" x="20" y="88" class="pipeline-box" rx="6"/><rect width="150" height="44" x="150" y="36" class="pipeline-box" rx="6"/><rect width="150" height="44" x="150" y="92" class="pipeline-box" rx="6"/><rect width="150" height="44" x="150" y="148" class="pipeline-box" rx="6"/><rect width="116" height="52" x="330" y="88" class="pipeline-box pipeline-accent" rx="6"/><rect width="132" height="52" x="476" y="88" class="pipeline-box" rx="6"/><rect width="104" height="52" x="632" y="88" class="pipeline-box pipeline-accent" rx="6"/><rect width="140" height="52" x="60" y="284" class="pipeline-box" rx="6"/><rect width="128" height="52" x="220" y="284" class="pipeline-box" rx="6"/><rect width="138" height="52" x="412" y="284" class="pipeline-box" rx="6"/><rect width="138" height="52" x="590" y="284" class="pipeline-box" rx="6"/><g marker-end="url(#pipeline-arrow)" class="pipeline-line"><path d="M120 114h15V58h15"/><path d="M120 114h30"/><path d="M120 114h15v56h15"/><path d="M300 58h15v56h15"/><path d="M300 114h30"/><path d="M300 170h15v-56h15"/><path d="M446 114h30"/><path d="M608 114h24"/><path d="M388 88V48h296v40"/><path d="M542 140v88H130v56"/><path d="M284 228v56"/><path d="M348 310h64"/><path d="M550 310h40"/></g><text x="18" y="26" class="pipeline-small">nexus — GitHub Actions</text><text x="18" y="262" class="pipeline-small">nexus-manifests</text><text x="398" y="262" class="pipeline-small">cluster</text><g text-anchor="middle"><text x="70" y="111" class="pipeline-label">Affected</text><text x="70" y="128" class="pipeline-small">push / PR</text><text x="225" y="55" class="pipeline-label">Lint &amp; format</text><text x="225" y="71" class="pipeline-small">always runs</text><text x="225" y="111" class="pipeline-label">Test</text><text x="225" y="127" class="pipeline-small">skipped if none</text><text x="225" y="167" class="pipeline-label">Build images</text><text x="225" y="183" class="pipeline-small">skipped if no targets</text><text x="388" y="111" class="pipeline-label">Checks gate</text><text x="388" y="128" class="pipeline-small">required check</text><text x="542" y="111" class="pipeline-label">Deploy</text><text x="542" y="128" class="pipeline-small">if passed + targets</text><text x="684" y="119" class="pipeline-label">Pipeline gate</text><text x="684" y="166" class="pipeline-small">trunk only</text><text x="400" y="222" class="pipeline-small">one commit per run</text><text x="130" y="307" class="pipeline-label">pr-&lt;n&gt; branch</text><text x="130" y="324" class="pipeline-small">PR deploys</text><text x="284" y="307" class="pipeline-label">main</text><text x="284" y="324" class="pipeline-small">trunk deploys</text><text x="130" y="358" class="pipeline-small">not synced yet,</text><text x="130" y="374" class="pipeline-small">deleted on PR close</text><text x="481" y="307" class="pipeline-label">ArgoCD</text><text x="481" y="324" class="pipeline-small">webhook, auto-sync</text><text x="659" y="307" class="pipeline-label">Workloads</text><text x="659" y="324" class="pipeline-small">new image tag</text></g></svg>