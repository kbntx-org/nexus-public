<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="cloudflare-controller-title" role="img" viewBox="0 0 760 460"><title id="cloudflare-controller-title">cloudflare-controller: an app chart declares an AccessApplication for one hostname that references an ordered list of AccessPolicy resources; the cloudflared chart declares the cluster&apos;s Tunnel. The controller reconciles them into a Zero Trust Access application and policies and a tunnel configuration with ordered ingress rules, a catch-all and private CIDR routes on Cloudflare, and into cloudflared pods with a PodDisruptionBudget and a DNSEndpoint in the cluster, which external-dns turns into a proxied Cloudflare DNS record per public hostname.</title><style>.cloudflare-controller-box{fill:none;stroke:currentColor;stroke-width:1.5}
.cloudflare-controller-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.cloudflare-controller-label,.cloudflare-controller-small{font-family:var(--md-text-font-family,sans-serif);text-anchor:middle}
.cloudflare-controller-label{fill:currentColor;font-size:14px}
.cloudflare-controller-small{fill:var(--md-default-fg-color--light,#666);font-size:12px}
.cloudflare-controller-start{text-anchor:start}
.cloudflare-controller-line{fill:none;stroke:currentColor;stroke-width:1.5}
.cloudflare-controller-head{fill:currentColor}</style><defs><marker id="cloudflare-controller-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4Z" class="cloudflare-controller-head"/></marker></defs><rect width="256" height="202" x="8" y="24" class="cloudflare-controller-zone" rx="6"/><text x="16" y="40" class="cloudflare-controller-small cloudflare-controller-start">app chart</text><rect width="232" height="52" x="20" y="48" class="cloudflare-controller-box" rx="6"/><text x="136" y="70" class="cloudflare-controller-label">AccessApplication</text><text x="136" y="88" class="cloudflare-controller-small">one hostname · session duration</text><rect width="232" height="68" x="20" y="146" class="cloudflare-controller-box" rx="6"/><text x="136" y="168" class="cloudflare-controller-label">AccessPolicy</text><text x="136" y="186" class="cloudflare-controller-small">allow · deny · non_identity · bypass</text><text x="136" y="202" class="cloudflare-controller-small">include OR · require AND · exclude wins</text><rect width="256" height="104" x="8" y="250" class="cloudflare-controller-zone" rx="6"/><text x="16" y="266" class="cloudflare-controller-small cloudflare-controller-start">cloudflared chart</text><rect width="232" height="68" x="20" y="274" class="cloudflare-controller-box" rx="6"/><text x="136" y="296" class="cloudflare-controller-label">Tunnel</text><text x="136" y="314" class="cloudflare-controller-small">ordered ingress rules</text><text x="136" y="330" class="cloudflare-controller-small">private CIDR routes · PDB</text><rect width="164" height="88" x="300" y="136" class="cloudflare-controller-box" rx="6"/><text x="382" y="172" class="cloudflare-controller-label">cloudflare-controller</text><text x="382" y="190" class="cloudflare-controller-small">controller-runtime operator</text><text x="382" y="206" class="cloudflare-controller-small">reconciles the three CRDs</text><rect width="256" height="244" x="496" y="24" class="cloudflare-controller-zone" rx="6"/><text x="504" y="40" class="cloudflare-controller-small cloudflare-controller-start">Cloudflare</text><rect width="232" height="52" x="508" y="48" class="cloudflare-controller-box" rx="6"/><text x="624" y="70" class="cloudflare-controller-label">Zero Trust Access</text><text x="624" y="88" class="cloudflare-controller-small">application + reusable policies</text><rect width="232" height="68" x="508" y="116" class="cloudflare-controller-box" rx="6"/><text x="624" y="138" class="cloudflare-controller-label">Tunnel configuration</text><text x="624" y="156" class="cloudflare-controller-small">ingress rules + catch-all</text><text x="624" y="172" class="cloudflare-controller-small">private CIDR routes</text><rect width="232" height="52" x="508" y="200" class="cloudflare-controller-box" rx="6"/><text x="624" y="222" class="cloudflare-controller-label">DNS records</text><text x="624" y="240" class="cloudflare-controller-small">proxied CNAME to the tunnel</text><rect width="256" height="160" x="496" y="292" class="cloudflare-controller-zone" rx="6"/><text x="504" y="308" class="cloudflare-controller-small cloudflare-controller-start">cluster · the Tunnel&apos;s namespace</text><rect width="232" height="52" x="508" y="316" class="cloudflare-controller-box" rx="6"/><text x="624" y="338" class="cloudflare-controller-label">DNSEndpoint</text><text x="624" y="356" class="cloudflare-controller-small">an endpoint per public hostname</text><rect width="232" height="52" x="508" y="384" class="cloudflare-controller-box" rx="6"/><text x="624" y="406" class="cloudflare-controller-label">cloudflared pods</text><text x="624" y="424" class="cloudflare-controller-small">Deployment · token Secret · PDB</text><g marker-end="url(#cloudflare-controller-arrow)" class="cloudflare-controller-line"><path d="M136 100v44"/><path d="M252 74h24v84h22"/><path d="M252 180h46"/><path d="M252 300h24v-96h22"/><path d="M464 150h16V74h26"/><path d="M464 172h42"/><path d="M432 224v118h74"/><path d="M352 224v186h154"/><path d="M624 316v-62"/></g><text x="144" y="126" class="cloudflare-controller-small cloudflare-controller-start">policyRefs, in order</text><text x="632" y="285" class="cloudflare-controller-small cloudflare-controller-start">external-dns</text></svg>