<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="platform-overview-title" role="img" viewBox="0 0 760 296"><title id="platform-overview-title">Nexus at a glance: Internet traffic goes through Cloudflare and a tunnel opened from inside the cluster to Traefik, then to the apps; ArgoCD syncs the apps and platform components from GitHub; Vault feeds secrets to the apps through External Secrets; everything but Cloudflare and GitHub runs in k3s on Hetzner, which has no inbound ports</title><style>.platform-overview-box{fill:none;stroke:currentColor;stroke-width:1.5}
.platform-overview-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.platform-overview-line{fill:none;stroke:currentColor;stroke-width:1.5}
.platform-overview-dashed{stroke-dasharray:5 3}
.platform-overview-head{fill:currentColor}
.platform-overview-label{fill:currentColor;font:14px var(--md-text-font-family,sans-serif)}
.platform-overview-small{fill:var(--md-default-fg-color--light,#666);font:12px var(--md-text-font-family,sans-serif)}</style><defs><marker id="platform-overview-arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" class="platform-overview-head"/></marker></defs><rect width="380" height="280" x="372" y="8" class="platform-overview-zone" rx="6"/><rect width="112" height="52" x="20" y="40" class="platform-overview-box" rx="6"/><rect width="128" height="52" x="168" y="40" class="platform-overview-box" rx="6"/><rect width="140" height="52" x="20" y="216" class="platform-overview-box" rx="6"/><rect width="120" height="52" x="392" y="40" class="platform-overview-box" rx="6"/><rect width="120" height="52" x="392" y="128" class="platform-overview-box" rx="6"/><rect width="120" height="52" x="392" y="216" class="platform-overview-box" rx="6"/><rect width="124" height="140" x="616" y="40" class="platform-overview-box" rx="6"/><rect width="124" height="52" x="616" y="216" class="platform-overview-box" rx="6"/><g marker-end="url(#platform-overview-arrow)" class="platform-overview-line"><path d="M132 66h36"/><path d="M296 66h96"/><path d="M512 66h104"/><path d="M512 154h104" class="platform-overview-dashed"/><path d="M160 242h232"/><path d="M512 242h52v-72h52"/><path d="M512 242h104"/></g><text x="382" y="26" class="platform-overview-small">k3s on Hetzner · no inbound ports</text><g text-anchor="middle"><text x="76" y="63" class="platform-overview-label">Internet</text><text x="76" y="80" class="platform-overview-small">users</text><text x="232" y="63" class="platform-overview-label">Cloudflare</text><text x="232" y="80" class="platform-overview-small">edge · DNS</text><text x="90" y="239" class="platform-overview-label">GitHub</text><text x="90" y="256" class="platform-overview-small">Git repos</text><text x="452" y="63" class="platform-overview-label">Traefik</text><text x="452" y="80" class="platform-overview-small">ingress</text><text x="452" y="151" class="platform-overview-label">Vault</text><text x="452" y="168" class="platform-overview-small">secrets</text><text x="452" y="239" class="platform-overview-label">ArgoCD</text><text x="452" y="256" class="platform-overview-small">GitOps</text><text x="678" y="107" class="platform-overview-label">Apps</text><text x="678" y="124" class="platform-overview-small">workloads</text><text x="678" y="239" class="platform-overview-label">Platform</text><text x="678" y="256" class="platform-overview-small">components</text><text x="344" y="58" class="platform-overview-small">Tunnel</text><text x="276" y="234" class="platform-overview-small">GitOps sync</text><text x="564" y="128" class="platform-overview-small">External</text><text x="564" y="144" class="platform-overview-small">Secrets</text></g></svg>