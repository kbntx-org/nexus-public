<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="observability-title" role="img" viewBox="0 0 760 344"><title id="observability-title">Observability stack: VictoriaMetrics scrapes node-exporter and kube-state-metrics and stores on a disk volume; Promtail pushes logs to Loki, which stores in R2; Grafana queries both and keeps its state in a CNPG Postgres backed up to R2</title><style>.observability-box{fill:none;stroke:currentColor;stroke-width:1.5}
.observability-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.observability-accent{stroke:var(--md-accent-fg-color,#536dfe)}
.observability-line{fill:none;stroke:currentColor;stroke-width:1.5}
.observability-head{fill:currentColor}
.observability-label{fill:currentColor;font:14px var(--md-text-font-family,sans-serif)}
.observability-small{fill:var(--md-default-fg-color--light,#666);font:12px var(--md-text-font-family,sans-serif)}</style><defs><marker id="observability-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="observability-head"/></marker></defs><rect width="584" height="328" x="8" y="8" class="observability-zone" rx="6"/><rect width="148" height="328" x="604" y="8" class="observability-zone" rx="6"/><rect width="144" height="44" x="20" y="40" class="observability-box" rx="6"/><rect width="144" height="44" x="20" y="100" class="observability-box" rx="6"/><rect width="144" height="44" x="20" y="258" class="observability-box" rx="6"/><rect width="160" height="52" x="236" y="62" class="observability-box observability-accent" rx="6"/><rect width="160" height="52" x="236" y="158" class="observability-box observability-accent" rx="6"/><rect width="160" height="52" x="236" y="254" class="observability-box observability-accent" rx="6"/><rect width="144" height="52" x="432" y="62" class="observability-box" rx="6"/><rect width="144" height="52" x="432" y="158" class="observability-box" rx="6"/><rect width="116" height="52" x="620" y="254" class="observability-box" rx="6"/><g marker-end="url(#observability-arrow)" class="observability-line"><path d="M236 88h-56V62h-16"/><path d="M180 88v34h-16"/><path d="M164 280h72"/><path d="M316 158v-44"/><path d="M316 210v44"/><path d="M396 88h36"/><path d="M396 184h36"/><path d="M396 280h224"/><path d="M576 184h102v70"/></g><text x="18" y="26" class="observability-small">cluster — monitoring chart</text><text x="614" y="26" class="observability-small">Cloudflare R2</text><g text-anchor="middle"><text x="92" y="58" class="observability-label">node-exporter</text><text x="92" y="74" class="observability-small">DaemonSet</text><text x="92" y="118" class="observability-label">kube-state-metrics</text><text x="92" y="134" class="observability-small">Kubernetes objects</text><text x="92" y="276" class="observability-label">Promtail</text><text x="92" y="292" class="observability-small">DaemonSet</text><text x="208" y="81" class="observability-small">scrape</text><text x="200" y="273" class="observability-small">push</text><text x="316" y="85" class="observability-label">VictoriaMetrics</text><text x="316" y="102" class="observability-small">metrics</text><text x="316" y="181" class="observability-label">Grafana</text><text x="316" y="198" class="observability-small">dashboards, alerts</text><text x="316" y="277" class="observability-label">Loki</text><text x="316" y="294" class="observability-small">logs</text><text x="504" y="85" class="observability-label">Disk volume</text><text x="504" y="102" class="observability-small">PVC</text><text x="504" y="181" class="observability-label">CNPG Postgres</text><text x="504" y="198" class="observability-small">Grafana state</text><text x="678" y="277" class="observability-label">Bucket</text><text x="678" y="294" class="observability-small">S3-compatible</text><text x="508" y="272" class="observability-small">chunks + index</text><text x="644" y="176" class="observability-small">backups</text></g><g class="observability-small"><text x="324" y="140">PromQL</text><text x="324" y="236">LogQL</text></g></svg>