<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="observability-title" role="img" viewBox="0 0 760 344"><title id="observability-title">Observability stack: an Alloy DaemonSet ships pod logs to Loki and host metrics to Mimir, an Alloy cluster collector sends Kubernetes metrics to Mimir; Mimir and Loki store in R2; Grafana queries both and keeps its state in a CNPG Postgres backed up to R2</title><style>.observability-box{fill:none;stroke:currentColor;stroke-width:1.5}
.observability-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.observability-accent{stroke:var(--md-accent-fg-color,#536dfe)}
.observability-line{fill:none;stroke:currentColor;stroke-width:1.5}
.observability-head{fill:currentColor}
.observability-label{fill:currentColor;font:14px var(--md-text-font-family,sans-serif)}
.observability-small{fill:var(--md-default-fg-color--light,#666);font:12px var(--md-text-font-family,sans-serif)}</style><defs><marker id="observability-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4z" class="observability-head"/></marker></defs><rect width="584" height="328" x="8" y="8" class="observability-zone" rx="6"/><rect width="148" height="328" x="604" y="8" class="observability-zone" rx="6"/><rect width="144" height="52" x="20" y="62" class="observability-box" rx="6"/><rect width="144" height="52" x="20" y="254" class="observability-box" rx="6"/><rect width="160" height="52" x="236" y="62" class="observability-box observability-accent" rx="6"/><rect width="160" height="52" x="236" y="158" class="observability-box observability-accent" rx="6"/><rect width="160" height="52" x="236" y="254" class="observability-box observability-accent" rx="6"/><rect width="144" height="52" x="432" y="158" class="observability-box" rx="6"/><rect width="116" height="52" x="620" y="254" class="observability-box" rx="6"/><g marker-end="url(#observability-arrow)" class="observability-line"><path d="M164 76h72"/><path d="M164 268h36V100h36"/><path d="M164 292h72"/><path d="M316 158v-44"/><path d="M316 210v44"/><path d="M396 88h310v166"/><path d="M396 280h224"/><path d="M576 184h74v70"/></g><text x="18" y="26" class="observability-small">cluster — monitoring chart</text><text x="614" y="26" class="observability-small">Cloudflare R2</text><g text-anchor="middle"><text x="92" y="85" class="observability-label">Alloy cluster</text><text x="92" y="102" class="observability-small">Kubernetes metrics</text><text x="92" y="277" class="observability-label">Alloy node</text><text x="92" y="294" class="observability-small">logs, host metrics</text><text x="316" y="85" class="observability-label">Mimir</text><text x="316" y="102" class="observability-small">metrics</text><text x="316" y="181" class="observability-label">Grafana</text><text x="316" y="198" class="observability-small">dashboards, alerts</text><text x="316" y="277" class="observability-label">Loki</text><text x="316" y="294" class="observability-small">logs</text><text x="504" y="181" class="observability-label">CNPG Postgres</text><text x="504" y="198" class="observability-small">Grafana state</text><text x="678" y="277" class="observability-label">Buckets</text><text x="678" y="294" class="observability-small">S3-compatible</text><text x="508" y="80" class="observability-small">blocks</text><text x="508" y="272" class="observability-small">chunks + index</text><text x="612" y="176" class="observability-small">backups</text></g><g class="observability-small"><text x="324" y="140">PromQL</text><text x="324" y="236">LogQL</text></g></svg>