<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="cluster-shape-title" role="img" viewBox="0 0 600 300"><title id="cluster-shape-title">Cluster shape: inside the Hetzner private network, a single k3s control plane with embedded etcd that can be extended to HA; pre-provisioned worker pools, created by Terraform and configured by the Ansible k3s role, join it as agents.</title><style>.cluster-shape-box{fill:none;stroke:currentColor;stroke-width:1.5}
.cluster-shape-zone{fill:none;stroke:var(--md-default-fg-color--lighter,#999);stroke-dasharray:6 4}
.cluster-shape-label,.cluster-shape-small{font-family:var(--md-text-font-family,sans-serif);text-anchor:middle}
.cluster-shape-label{fill:currentColor;font-size:14px}
.cluster-shape-small{fill:var(--md-default-fg-color--light,#666);font-size:12px}
.cluster-shape-start{text-anchor:start}
.cluster-shape-end{text-anchor:end}
.cluster-shape-line{fill:none;stroke-width:1.5}
.cluster-shape-line{stroke:currentColor}
.cluster-shape-head{fill:currentColor}</style><defs><marker id="cluster-shape-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="m0 0 8 4-8 4Z" class="cluster-shape-head"/></marker></defs><rect width="400" height="284" x="184" y="8" class="cluster-shape-zone" rx="6"/><text x="192" y="24" class="cluster-shape-small cluster-shape-start">Hetzner private network (VPC)</text><rect width="144" height="68" x="16" y="48" class="cluster-shape-box" rx="6"/><text x="88" y="70" class="cluster-shape-label">Terraform</text><text x="88" y="88" class="cluster-shape-small">creates the servers</text><text x="88" y="104" class="cluster-shape-small">of the static nodes</text><rect width="144" height="68" x="16" y="176" class="cluster-shape-box" rx="6"/><text x="88" y="198" class="cluster-shape-label">Ansible</text><text x="88" y="216" class="cluster-shape-small">k3s role installs</text><text x="88" y="232" class="cluster-shape-small">and configures k3s</text><rect width="200" height="68" x="368" y="40" class="cluster-shape-box" rx="6"/><text x="468" y="62" class="cluster-shape-label">Control plane</text><text x="468" y="80" class="cluster-shape-small">single k3s server</text><text x="468" y="96" class="cluster-shape-small">embedded etcd, HA-ready</text><rect width="228" height="68" x="200" y="200" class="cluster-shape-box" rx="6"/><text x="314" y="222" class="cluster-shape-label">Pre-provisioned pools</text><text x="314" y="240" class="cluster-shape-small">k3s agents, always running</text><text x="314" y="256" class="cluster-shape-small">sized in Terraform</text><g marker-end="url(#cluster-shape-arrow)" class="cluster-shape-line"><path d="M160 72h206"/><path d="M160 100h84v98"/><path d="M160 226h38"/><path d="M160 186h170V92h36"/><path d="M400 200v-90"/></g><text x="408" y="160" class="cluster-shape-small cluster-shape-start">join</text></svg>